<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FBFAF7">
<title>CozyNest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  color-scheme:light;
  --bg:#FBFAF7;--surface:#FFFDF8;--sand:#EFE7DA;--beige:#E3D8C6;--border:#E8E0D2;
  --text:#3A3835;--muted:#8A857D;--sage:#8FA088;--sage-soft:#E3EADF;--rose:#B98589;--rose-soft:#F2E1DE;
  --note-bg:#F3EDE2;--img-bg:#FFFFFF;
  --radius:16px;--shadow:0 2px 14px rgba(40,38,35,.06);
  --f-head:"Fraunces",Georgia,serif;--f-body:"Nunito Sans",system-ui,sans-serif;
}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-head);font-weight:500;margin:0;line-height:1.2;letter-spacing:-.01em}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:16px;padding-right:16px}

/* Header */
.top{padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:12px}
.top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.brand h1{font-size:30px}
.sub{margin:2px 0 0;color:var(--muted);font-size:15px}
.top-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin-left:auto}
.sync{font-size:13px;color:var(--muted);min-height:18px}
.auth{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;font-size:13px;color:var(--muted)}
.bar{height:4px;border-radius:999px;background:var(--sand);overflow:hidden;margin-top:14px}
.bar span{display:block;height:100%;width:0;background:var(--sage);border-radius:inherit;transition:width .4s ease}
.notice{margin:12px 0 0;padding:10px 14px;border-radius:12px;background:var(--rose-soft);font-size:14px}
.modenav,.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.modenav a,.tabs a{text-decoration:none;padding:8px 14px;border-radius:999px;font-size:14px;border:1px solid var(--border);background:var(--surface);min-height:44px;display:inline-flex;align-items:center}
.modenav a[aria-current="page"],.tabs a[aria-current="page"]{background:var(--sand);border-color:var(--beige);font-weight:600}
main{padding-top:4px;padding-bottom:48px}
body.has-bottom main{padding-bottom:128px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid var(--border);background:var(--sand);color:var(--text);font-weight:600;font-size:15px;line-height:1.2;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--beige)}
.btn:disabled{opacity:.5;cursor:default}
.btn:disabled:hover{background:var(--sand)}
.btn-primary{background:var(--text);color:var(--surface);border-color:var(--text)}
.btn-primary:hover{background:var(--text);opacity:.88}
.btn-primary:disabled:hover{background:var(--text)}
.btn-compact{padding:8px 12px;font-size:14px}

/* Übersicht */
.overview-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 0}
.progress-text{margin:0;color:var(--muted);font-size:15px}
.room{margin-top:28px}
.room-title{font-size:24px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:720px){.grid{grid-template-columns:repeat(2,1fr)}.brand h1{font-size:36px}}
@media (min-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);text-decoration:none;overflow:hidden}
.tile:hover{border-color:var(--beige)}
.tile-media{position:relative}
.tile-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:2px}
.tile-title{font-size:21px;margin-bottom:2px}
.tile-meta{margin:0;color:var(--muted);font-size:14px}
.tile-status{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:14px;font-weight:600;min-height:57px}
.tile-status-text{display:flex;flex-direction:column;min-width:0}
.tile-fav-name{color:var(--muted);font-size:13px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge-new{position:absolute;top:10px;left:10px;background:var(--surface);border:1px solid var(--beige);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700}

/* Bilder */
.imgbox{position:relative;aspect-ratio:4/3;background:var(--img-bg);padding:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.imgbox img{width:100%;height:100%;object-fit:contain;display:block}
.img-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;color:var(--muted);text-decoration:none}
.imgbox.mini{width:56px;height:56px;aspect-ratio:auto;padding:4px;border-radius:10px;border:1px solid var(--border);flex:none}
.imgbox.thumb{border-radius:10px;border:1px solid var(--border)}
.badge-order{position:absolute;top:10px;right:10px;z-index:1;background:var(--sage-soft);border:1px solid var(--sage);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700}

/* Kategorie + Karten */
.back{display:inline-flex;align-items:center;min-height:44px;text-decoration:none;color:var(--muted);font-weight:600}
.cat-head{margin:2px 0 18px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.cat-room{margin:0;color:var(--muted);font-size:14px}
.cat-title{font-size:30px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;transition:opacity .2s ease}
.card.is-no{opacity:.55}
.card-body{padding:16px;display:flex;flex-direction:column;gap:8px}
.badge-reco{align-self:flex-start;background:var(--sage-soft);border:1px solid var(--sage);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
.card-title{font-family:var(--f-body);font-weight:700;font-size:17px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.summary{margin:0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{margin:2px 0 0;font-family:var(--f-head);font-size:26px;line-height:1.15}
.price.is-unknown{font-family:var(--f-body);font-size:16px;color:var(--muted)}
.dims{margin:0;font-size:14px}
.vorgabe-hint{margin:0;font-size:13px;font-weight:600;color:var(--rose)}
.note{background:var(--note-bg);border-left:4px solid var(--sage);border-radius:10px;padding:10px 12px}
.note-label{font-weight:700;font-size:14px;margin:0 0 4px}
.note-text{margin:0;white-space:pre-line;font-size:15px;overflow-wrap:anywhere}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}
.seg-btn{min-height:44px;border-radius:12px;border:1px solid var(--border);background:var(--sand);font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:6px 8px}
.seg-btn:hover{background:var(--beige)}
.seg-fav.is-on{background:var(--rose-soft);border-color:var(--rose)}
.seg-fav.is-on .ico{color:var(--rose)}
.seg-ok.is-on{background:var(--sage-soft);border-color:var(--sage)}
.seg-ok.is-on .ico{color:var(--sage)}
.seg-no.is-on{background:var(--sand);border-color:var(--muted)}
.seg-no.is-on .ico{color:var(--muted)}
.prio-btn.is-on{background:var(--beige);border-color:var(--muted)}
.product-link{align-self:flex-start;display:inline-flex;align-items:center;min-height:44px;font-size:14px;color:var(--muted)}
textarea.comment{width:100%;min-height:44px;resize:none;border:1px solid var(--border);border-radius:12px;background:var(--bg);padding:10px 12px;font-size:15px;line-height:1.45;overflow:hidden}
textarea:focus,input:focus,select:focus{outline:2px solid var(--beige);border-color:var(--beige)}
details.more{border-top:1px solid var(--border);padding-top:4px}
details.more summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600;font-size:14px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 8px;font-size:14px}
dl.facts dt{color:var(--muted)}
dl.facts dd{margin:0}
.pc-title{font-size:14px;font-weight:700;margin:8px 0 2px}
.pc{font-size:14px;margin:0;padding-left:18px}
.cat-comment{margin-top:28px;max-width:720px}
.cc-label{display:block;font-weight:600;margin-bottom:6px}

/* Unterer Balken, Toast, Dialog */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--border)}
.btn-done{width:100%;max-width:420px}
.btn-done[aria-pressed="true"]{background:var(--sage-soft);color:var(--text);border-color:var(--sage)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:30;max-width:calc(100% - 32px);background:var(--text);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow)}
.dlg{border:none;border-radius:var(--radius);background:var(--surface);color:var(--text);padding:20px;width:min(580px,calc(100% - 24px));max-height:calc(100% - 32px);box-shadow:var(--shadow)}
.dlg::backdrop{background:color-mix(in srgb,var(--text) 30%,transparent)}
.dlg-title{font-size:22px;margin-bottom:12px}
.dlg-body p{margin:0 0 8px}
.dlg-list{margin:0 0 8px;padding-left:18px;font-size:14px;max-height:40vh;overflow:auto}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:16px}

/* Formulare */
.field{display:flex;flex-direction:column;gap:4px;margin:0 0 12px}
.field>span{font-size:14px;font-weight:600}
.field input,.field select,.field textarea{min-height:44px;width:100%;border:1px solid var(--border);border-radius:12px;background:var(--bg);padding:10px 12px;font-size:16px}
.field textarea{resize:vertical;line-height:1.45}
fieldset{border:1px solid var(--border);border-radius:12px;padding:12px;margin:0 0 12px;min-width:0}
legend{font-weight:700;padding:0 6px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg-prio{max-width:260px}
.dup-hint{margin:-4px 0 12px;padding:8px 12px;border-radius:12px;background:var(--rose-soft);font-size:14px}
.addform{max-width:560px}
.saved-title{font-family:var(--f-head);font-size:28px;margin:0 0 4px}

/* Panels, Zeilen, Chips */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin:16px 0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.panel-title{font-size:22px}
.panel p{margin:4px 0}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--border)}
.row.is-no{opacity:.55}
.row.is-focus{background:var(--sage-soft);border-radius:12px;padding-left:8px;padding-right:8px}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-name{font-weight:600;text-decoration:none;overflow-wrap:anywhere;margin:0}
a.row-name:hover{text-decoration:underline}
.row-meta{margin:0;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.row-comment{margin:2px 0 0;font-size:14px;white-space:pre-line;overflow-wrap:anywhere}
.row-url{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.row-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row-price{font-weight:700;white-space:nowrap}
@media (max-width:560px){.row{flex-wrap:wrap}.row-side{width:100%;flex-direction:row;flex-wrap:wrap;justify-content:space-between;align-items:center;padding-left:68px}}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;border:1px solid var(--border);background:var(--sand);white-space:nowrap}
.chip-rose{background:var(--rose-soft);border-color:var(--rose)}
.chip-sage{background:var(--sage-soft);border-color:var(--sage)}
.chip-plain{background:var(--surface)}
.chip-gap{background:var(--rose-soft);border-color:var(--rose);white-space:normal;align-self:flex-start;margin-top:4px}
.note-inline{margin:4px 0 0;padding:6px 10px;border-radius:10px;background:var(--note-bg);font-size:14px;white-space:pre-line;overflow-wrap:anywhere}
.counts{font-size:17px;margin:2px 0 6px}
.group{margin-top:18px}
.group-title{font-size:18px;margin-bottom:4px}
.group-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dec-cc{margin:8px 0 0;font-size:14px;white-space:pre-line}
.sum{display:flex;justify-content:space-between;gap:12px;font-weight:700;padding-top:10px;border-top:1px solid var(--border)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.cat-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:24px;margin-bottom:4px}
.muted{color:var(--muted)}
.small{font-size:13px}
.hint{font-size:13px;color:var(--muted);margin:4px 0}
.empty{color:var(--muted);padding:32px 0;text-align:center}
.check{display:inline-flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--sage);margin:0}
.bookmarklet{display:inline-flex;align-items:center;min-height:44px;padding:10px 18px;border-radius:12px;border:1px dashed var(--muted);background:var(--sand);font-weight:700;text-decoration:none;cursor:grab}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand">
        <h1>CozyNest</h1>
        <p class="sub">Unsere Auswahl für die neue Wohnung</p>
      </div>
      <div class="top-side">
        <span id="sync" class="sync" role="status" aria-live="polite"></span>
        <div id="auth" class="auth"></div>
      </div>
    </div>
    <nav id="modenav" class="modenav" aria-label="Bereiche" hidden></nav>
    <div id="bar" class="bar" role="progressbar" aria-label="Fortschritt" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="barfill"></span></div>
    <p id="notice" class="notice" role="status" hidden></p>
  </div>
</header>
<main id="app" class="wrap"></main>
<div id="bottom" class="bottom" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<dialog id="dlg" class="dlg"></dialog>

  const eur = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' });

  const num1 = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 1 });

  function priceNum(p) {

  const AVAIL = { instock: 'Auf Lager', outofstock: 'Nicht vorrätig', preorder: 'Vorbestellbar', backorder: 'Nachbestellbar', limitedavailability: 'Begrenzt verfügbar', discontinued: 'Nicht mehr erhältlich', soldout: 'Ausverkauft', instoreonly: 'Nur im Markt', onlineonly: 'Nur online' };
  function fmtAvail(a) {

  }
  function slug(s) {

  const catIdFor = (room, name) => 'k-' + slug(room) + '-' + slug(name);
  function hash8(s) {
    let x = 0x811c9dc5;

  function cleanUrl(raw) {

  const ymd = () => { const d = new Date(); return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0'); };

  /* ---------- Daten-Sicht ---------- */
  const prioOf = (i) => ([1, 2, 3].includes(i.prio) ? i.prio : 2);
  const displayName = (i) => (i && (i.name || i.title || i.shop || shopKey(i.url))) || '';

  const sortItems = (list) => list.sort((a, b) => prioOf(a) - prioOf(b) || toMs(a.addedAt) - toMs(b.addedAt) || a.id.localeCompare(b.id));

  function decision(catId) {
    const raw = S.decisions.get(catId) || {};

    const seen = new Set(fav ? [fav] : []);

  /* ---------- Firestore ---------- */
  const serverTs = () => (S.fb ? S.fb.fsM.serverTimestamp() : new Date().toISOString());

  async function initFirebase() {

  function startListeners() {

  function writeError(e) {

  async function commitBatches(ops) {
    if (!S.fb) return noDb();
    const { fsM, db } = S.fb;
    S.pendingWrites++; updateSync();
    try {
      for (let i = 0; i < ops.length; i += BATCH_MAX) {

  /* ---------- Einmalige Migration alter Bewertungen ---------- */
  function dropLegacy() { try { localStorage.removeItem(LS_LEGACY); } catch (e) { /* ignorieren */ } }
  function legacyToDecisions(old) {
    const out = new Map();
    const get = (catId) => { if (!out.has(catId)) out.set(catId, { fav: null, ok: [], no: [], c: {}, cc: '' }); return out.get(catId); };
    function addItemState(id, v) {
      const it = S.items.get(id); if (!it) return;
      const d = get(it.catId);
      const st = String(v.status || v.s || '').toLowerCase();
      if (['fav', 'favorit', 'favorite'].includes(st)) { if (d.fav && d.fav !== id) d.ok.push(d.fav); d.fav = id; }
      else if (['ok', 'auch ok', 'auch_ok'].includes(st)) d.ok.push(id);
      else if (['no', 'nein'].includes(st)) d.no.push(id);
      const cm = isStr(v.kommentar) ? v.kommentar : isStr(v.comment) ? v.comment : isStr(v.c) ? v.c : '';
      if (cm) d.c[id] = cm;
    }
    const src = isObj(old) ? (old.decisions || old.categories || old.cats || old.state || old) : {};
    for (const [key, v] of Object.entries(isObj(src) ? src : {})) {
      if (!isObj(v)) continue;
      if (S.cats.has(key)) {
        const d = get(key);
        if (isStr(v.fav)) d.fav = v.fav;
        d.ok = d.ok.concat(arr(v.ok).filter(isStr));
        d.no = d.no.concat(arr(v.no).filter(isStr));
        if (isObj(v.c)) for (const [k, t] of Object.entries(v.c)) if (isStr(t)) d.c[k] = t;
        if (isStr(v.cc)) d.cc = v.cc;
      } else if (S.items.has(key)) addItemState(key, v);
    }
    if (isObj(old) && isObj(old.items)) for (const [key, v] of Object.entries(old.items)) if (isObj(v)) addItemState(key, v);
    for (const [k, d] of [...out]) {
      d.ok = [...new Set(d.ok)].filter((x) => x !== d.fav);
      d.no = [...new Set(d.no)].filter((x) => x !== d.fav && !d.ok.includes(x));
      if (!d.fav && !d.ok.length && !d.no.length && !Object.keys(d.c).length && !d.cc) out.delete(k);
    }
    return out;
  }
  function tryLegacyMigration() {
    if (S.legacyChecked) return;
    let raw = null;
    try { raw = localStorage.getItem(LS_LEGACY); } catch (e) { S.legacyChecked = true; return; }
    if (!raw) { S.legacyChecked = true; return; }
    if (!S.fb || !['categories', 'items', 'decisions'].every((n) => S.fresh.has(n))) return;
    S.legacyChecked = true;
    let old;
    try { old = JSON.parse(raw); } catch (e) { dropLegacy(); return; }
    const ops = [];
    for (const [catId, d] of legacyToDecisions(old)) {
      const cur = S.decisions.get(catId);
      const empty = !cur || (!cur.fav && !arr(cur.ok).length && !arr(cur.no).length && !(isObj(cur.c) && Object.keys(cur.c).length) && !cur.cc);
      if (empty) ops.push({ col: 'decisions', id: catId, data: Object.assign({}, d, { updatedAt: serverTs() }) });
    }
    if (!ops.length) { dropLegacy(); return; }
    commitBatches(ops).then((ok) => { if (ok) dropLegacy(); });
  }

  /* ---------- Bewertung, Kommentare, Fertig ---------- */
  function setStatus(catId, itemId, st) {
    const raw = S.decisions.get(catId) || {};
    const cur = statusOf(decision(catId), itemId);
    let fav = isStr(raw.fav) ? raw.fav : null;
    let ok = arr(raw.ok).filter((x) => x !== itemId);
    let no = arr(raw.no).filter((x) => x !== itemId);
    if (fav === itemId) fav = null;
    if (cur !== st) {
      if (st === 'fav') { if (fav) ok.push(fav); fav = itemId; }
      else if (st === 'ok') ok.push(itemId);
      else no.push(itemId);
    }
    ok = [...new Set(ok)].filter((x) => x !== fav);
    no = [...new Set(no)].filter((x) => x !== fav && !ok.includes(x));
    writeDoc('decisions', catId, { fav, ok, no, updatedAt: serverTs() });
  }

  function queueComment(key, catId, itemId, text) {
    S.drafts.set(key, { catId, itemId, text });

  function flushComment(key) {

  function canon(f, v) {
    if (v === null || v === undefined) return null;
    if (f === 'price') { const n = priceNum(v); return n === null ? null : n; }
    if (f === 'dims') {
      if (!isObj(v)) return null;
      const o = {}; for (const k of ['w', 'd', 'h']) if (typeof v[k] === 'number') o[k] = v[k];
      return Object.keys(o).length ? o : null;
    }
    if (Array.isArray(v)) { const a = v.filter(isStr).map((x) => x.trim()).filter(Boolean); return a.length ? a : null; }

  }

  /* Import / Export */
  const validId = (id) => isStr(id) && id.length > 0 && id.length <= 400 && !id.includes('/');
  function validateImport(o) {
    if (!isObj(o) || o.v !== 3) throw new Error('Keine CozyNest-Datei (v: 3 fehlt).');
    if (!['enrich', 'preise', 'full'].includes(o.kind)) throw new Error('Unbekannter Import-Typ: ' + String(o.kind));
    if (!Array.isArray(o.items)) throw new Error('Die Datei enthält keine Produktliste.');
    for (const it of o.items) if (!isObj(it) || !validId(it.id)) throw new Error('Ungültiger Eintrag in der Produktliste.');
    if (o.kind === 'full' && o.categories !== undefined && !Array.isArray(o.categories)) throw new Error('Kategorien sind ungültig.');
  }
  function planImport(o) {
    const plan = { kind: o.kind, ops: [], act: 0, upd: 0, unk: 0, unkIds: [], created: 0, cats: 0, kept: 0 };
    const strip = (x) => { const c = Object.assign({}, x); delete c.id; return c; };
    if (o.kind === 'full') {
      for (const c of arr(o.categories)) if (isObj(c) && validId(c.id)) { plan.ops.push({ col: 'categories', id: c.id, data: strip(c) }); plan.cats++; }
      for (const it of o.items) { plan.ops.push({ col: 'items', id: it.id, data: strip(it) }); if (S.items.has(it.id)) plan.upd++; else plan.created++; }
      for (const d of arr(o.decisions)) if (isObj(d) && validId(d.id)) plan.ops.push({ col: 'decisions', id: d.id, data: strip(d) });
      for (const d of arr(o.orders)) if (isObj(d) && validId(d.id)) plan.ops.push({ col: 'orders', id: d.id, data: strip(d) });
      if (isObj(o.progress)) plan.ops.push({ col: 'progress', id: 'state', data: strip(o.progress) });
      return plan;
    }
    const fields = o.kind === 'preise' ? PRICE_FIELDS : ENRICH_FIELDS;
    for (const it of o.items) {
      const cur = S.items.get(it.id);
      if (!cur) { plan.unk++; plan.unkIds.push(it.id); continue; }
      const edited = isObj(cur.edited) ? cur.edited : {};
      const data = {};
      for (const f of fields) {
        if (f === 'flags' || !(f in it)) continue;
        if (edited[f]) { plan.kept++; continue; }
        data[f] = it[f];
      }
      if (isObj(it.flags) && fields.includes('flags')) {
        const fl = {};
        for (const [k, v] of Object.entries(it.flags)) if (!edited[k] && (o.kind !== 'preise' || PRICE_FIELDS.includes(k))) fl[k] = v;
        if (Object.keys(fl).length) data.flags = fl;
      }
      for (const k of Object.keys(data)) if (RESEARCHER_FIELDS.includes(k)) delete data[k];
      if (cur.state === 'neu') { data.state = 'aktiv'; plan.act++; } else plan.upd++;
      plan.ops.push({ col: 'items', id: it.id, data });
    }
    return plan;
  }
  async function handleImportFile(file) {
    if (!requireRes()) return;
    let o;
    try { o = JSON.parse(await file.text()); validateImport(o); } catch (e) { toast('Import abgelehnt: ' + (e && e.message ? e.message : 'Datei ist kein gültiges JSON')); return; }
    const plan = planImport(o);
    if (plan.kind === 'full') {
      const first = await confirmDlg('Vollimport', [
        h('p', null, plan.cats + ' Kategorien · ' + (plan.upd + plan.created) + ' Produkte (' + plan.created + ' neu, ' + plan.upd + ' überschrieben)'),
        h('p', { class: 'muted' }, 'Ein Vollimport schreibt alle Felder – auch Notizen, Status, Entscheidungen und Bestellungen aus der Datei.')], 'Weiter');
      if (!first) return;
      const second = await confirmDlg('Wirklich alles übernehmen?', h('p', null, 'Vorhandene Werte mit gleicher ID werden überschrieben. Vorher ein Backup exportieren, falls noch nicht geschehen.'), 'Bestätigen');
      if (!second) return;
    } else {
      const ok = await confirmDlg(plan.kind === 'preise' ? 'Preis-Update importieren' : 'Anreicherung importieren', [
        h('p', { class: 'counts' }, plan.act + ' aktiviert · ' + plan.upd + ' aktualisiert · ' + plan.unk + ' unbekannte IDs'),
        plan.unk ? h('p', { class: 'muted small' }, 'Unbekannt (werden übersprungen): ' + plan.unkIds.slice(0, 12).join(', ') + (plan.unk > 12 ? ' …' : '')) : null,
        plan.kept ? h('p', { class: 'muted small' }, plan.kept + ' manuell bearbeitete Felder bleiben unverändert.') : null], 'Bestätigen');
      if (!ok) return;
    }
    if (!plan.ops.length) { toast('Nichts zu importieren'); return; }
    const done = await commitBatches(plan.ops);
    if (done) toast(plan.kind === 'full' ? 'Vollimport übernommen' : 'Import übernommen: ' + plan.act + ' aktiviert · ' + plan.upd + ' aktualisiert');
  }
  function plain(v) {

    if (Array.isArray(v)) return v.map(plain);
    if (typeof v === 'object') { const o = {}; for (const [k, x] of Object.entries(v)) o[k] = plain(x); return o; }
    return v;
  }

    else if (S.pendingWrites > 0 || S.drafts.size > 0 || pendingSnap || S.loaded.size < COLS.length) t = 'wird synchronisiert …';

  }
  function renderBottom(route) {
    const b = $('#bottom');
    const show = route.mode === 'rate' && S.loaded.has('items') && catsWithActive().length > 0;
    b.hidden = !show;
    document.body.classList.toggle('has-bottom', show);
    if (!show) { b.replaceChildren(); return; }
    const done = !!(S.progress && S.progress.done);
    b.replaceChildren(h('button', { type: 'button', class: 'btn btn-primary btn-done', 'aria-pressed': done ? 'true' : 'false', onclick: toggleDone }, done ? '✓ Als fertig markiert – zurücknehmen' : 'Ich bin fertig'));
  }

  /* ---------- Rendering ---------- */
  let queued = false;
  function scheduleRender() {
    if (queued) return;
    queued = true;
    (window.requestAnimationFrame || ((f) => setTimeout(f, 16)))(() => { queued = false; render(); });
  }
  function render() {
    const route = parseHash();
    const main = $('#app');
    renderHeader(route);
    renderBottom(route);
    if (route.mode === 'add') {
      if (S.addSaved && S.addSaved === location.hash) return;
      S.addSaved = '';
      const key = location.hash + '|' + (S.user ? (S.user.isAnonymous ? 'a' : 'g') : '-') + '|' + S.authReady + '|' + S.loaded.has('categories') + '|' + S.fbFailed + '|' + S.dbError;
      if (S.addKey === key) return;
      S.addKey = key;
      main.replaceChildren(viewAdd(route));
      S.lastRoute = location.hash;
      return;
    }
    S.addKey = ''; S.addSaved = '';
    const act = document.activeElement;
    const focus = act && main.contains(act) && act.dataset && act.dataset.fkey ? { key: act.dataset.fkey, s: act.selectionStart, e: act.selectionEnd } : null;
    const same = S.lastRoute === location.hash;
    const y = window.scrollY;
    let v;
    try {
      v = route.mode === 'order' ? viewOrder() : route.mode === 'edit' ? viewEdit(route) : route.k ? viewCategory(route.k) : viewOverview();
    } catch (e) {
      console.error(e);
      v = h('p', { class: 'empty' }, 'Ansicht konnte nicht aufgebaut werden. Bitte Seite neu laden.');
    }
    main.replaceChildren(v);
    main.querySelectorAll('textarea.autogrow').forEach(grow);
    if (focus) {
      const el = [...main.querySelectorAll('[data-fkey]')].find((x) => x.dataset.fkey === focus.key);
      if (el) { el.focus({ preventScroll: true }); try { el.setSelectionRange(focus.s, focus.e); } catch (e) { /* ignorieren */ } }
    }
    if (same) window.scrollTo(0, y);
    else {
      window.scrollTo(0, 0);
      if (route.focus) { const el = document.getElementById('item-' + route.focus); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center' }); }
    }
    S.lastRoute = location.hash;
  }

  function init() {
    try {
      if (parseHash().mode === 'rate') {
        const pv = Number(localStorage.getItem(LS_VISIT));
        S.prevVisit = pv > 0 ? pv : null;
        localStorage.setItem(LS_VISIT, String(Date.now()));
      }
    } catch (e) { /* localStorage nicht verfügbar */ }
    window.addEventListener('hashchange', render);
    window.addEventListener('online', updateSync);
    window.addEventListener('offline', updateSync);
    window.addEventListener('pagehide', flushAll);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushAll(); });
    render();
    initFirebase();
  }
  init();
  /* __END__ */
})();
</script>
</body>
</html>
