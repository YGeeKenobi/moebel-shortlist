<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>CozyNest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#FBFAF7; --surface:#FFFDF8; --sand:#EFE7DA; --beige:#E3D8C6; --border:#E8E0D2;
  --text:#3A3835; --muted:#8A857D;
  --sage:#8FA088; --sage-soft:#E3EADF; --rose:#B98589; --rose-soft:#F2E1DE; --note-bg:#F3EDE2;
  --img-bg:#FFFFFF;
  --shadow:0 2px 14px rgba(40,38,35,.06);
  --overlay:rgba(58,56,53,.32);
  --r:16px; --r-s:12px;
  --f-head:"Fraunces", Georgia, serif;
  --f-body:"Nunito Sans", system-ui, sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 var(--f-body)}
h1,h2,h3{font-family:var(--f-head);font-weight:500;margin:0;line-height:1.2}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.offscreen{position:absolute;left:-9999px;top:0;width:1px;height:1px;opacity:0}

/* Header */
.hdr{padding-top:env(safe-area-inset-top)}
.hdr-in{max-width:1200px;margin:0 auto;padding:18px 16px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hdr h1{font-size:1.75rem;letter-spacing:.01em}
.sub{color:var(--muted);font-size:.92rem;margin-top:2px}
.sync{color:var(--muted);font-size:.8rem;text-align:right;min-height:1.2em}
.bar{height:3px;background:var(--sand)}
.bar>i{display:block;height:100%;width:0;background:var(--sage);transition:width .4s ease}
.tabs{max-width:1200px;margin:0 auto;display:flex;gap:6px;padding:10px 16px 0;overflow-x:auto;scrollbar-width:none}
.tab{min-height:44px;display:inline-flex;align-items:center;padding:0 16px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.92rem;white-space:nowrap;border:1px solid transparent}
.tab:hover{color:var(--text)}
.tab.on{background:var(--sand);color:var(--text);border-color:var(--border)}
main{max-width:1200px;margin:0 auto;padding:16px 16px 128px}

/* Buttons */
.btn{min-height:44px;padding:0 16px;border-radius:var(--r-s);border:1px solid var(--border);background:var(--sand);color:var(--text);font-weight:600;font-size:.94rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;text-align:center}
.btn:hover{background:var(--beige)}
.btn:disabled{opacity:.5;cursor:default}
.btn:disabled:hover{background:var(--sand)}
.btn.primary{background:var(--text);color:var(--surface);border-color:var(--text)}
.btn.primary:hover{background:var(--text);opacity:.9}
.btn.on-sel{background:var(--sage-soft);border-color:var(--sage)}
.linkbtn{background:none;border:0;padding:0 4px;min-height:44px;color:var(--muted);text-decoration:underline;cursor:pointer}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 16px}

/* Chips & Badges */
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;background:var(--sand);font-size:.8rem;font-weight:600;line-height:1.6;border:1px solid var(--border)}
.chip.fav{background:var(--rose-soft);border-color:var(--rose)}
.chip.ok,.chip.sage{background:var(--sage-soft);border-color:var(--sage)}
.chip.no{color:var(--muted)}
.chip.gap{background:var(--rose-soft);border-color:var(--rose-soft)}
.chip.info{background:var(--surface)}
.badges{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap}
.badge{padding:3px 10px;border-radius:999px;font-size:.76rem;font-weight:700;background:var(--surface);border:1px solid var(--border)}
.badge.sage{background:var(--sage-soft);border-color:var(--sage)}
.badge.tr{position:absolute;top:10px;right:10px}

/* Grid, Tiles, Cards */
.grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:720px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.lead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:4px 0 20px;color:var(--muted)}
.room{margin:0 0 32px}
.room-h{font-size:1.45rem;margin:0 0 12px}
.tile,.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.tile{text-decoration:none}
.tile:hover{border-color:var(--beige)}
.tb{padding:12px 16px 16px;display:flex;flex-direction:column;gap:6px}
.tile-h{font-size:1.2rem}
.tile-st{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mini{display:inline-flex;gap:4px}
.media{position:relative;aspect-ratio:4/3;background:var(--img-bg);padding:8px}
.media img{width:100%;height:100%;object-fit:contain;display:block}
.fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.8rem;text-decoration:none}
.mini-img,.tmb{position:relative;background:var(--img-bg);border:1px solid var(--border);border-radius:8px;overflow:hidden;flex:none}
.mini-img{width:40px;height:40px;padding:2px}
.tmb{width:64px;height:64px;padding:3px}
.mini-img img,.tmb img{width:100%;height:100%;object-fit:contain;display:block}
.mini-img .fallback,.tmb .fallback{font-size:.62rem;text-align:center;line-height:1.1}
.card.is-no{opacity:.55}
.cbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.c-name{font:700 1.02rem/1.35 var(--f-body)}
.c-sum{color:var(--muted);font-size:.9rem}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{font:500 1.4rem/1.2 var(--f-head)}
.price.none{font:600 .95rem var(--f-body);color:var(--muted)}
.dims{font-size:.92rem}
.vhint{color:var(--rose);font-size:.88rem}
.note{background:var(--note-bg);border-left:4px solid var(--sage);border-radius:10px;padding:10px 12px}
.note b{display:block;font-size:.86rem;margin-bottom:2px}
.note p{white-space:pre-line;font-size:.94rem}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.segbtn{min-height:44px;border-radius:var(--r-s);border:1px solid var(--border);background:var(--sand);font-weight:600;font-size:.9rem;cursor:pointer;padding:0 6px}
.segbtn:hover{background:var(--beige)}
.segbtn .ic{color:var(--muted);margin-right:4px}
.segbtn.on{border-width:2px}
.segbtn.on.s-fav{background:var(--rose-soft);border-color:var(--rose)}
.segbtn.on.s-fav .ic{color:var(--rose)}
.segbtn.on.s-ok{background:var(--sage-soft);border-color:var(--sage)}
.segbtn.on.s-ok .ic{color:var(--sage)}
.segbtn.on.s-no{background:var(--sand);border-color:var(--muted)}
.plink{align-self:flex-start;min-height:44px;display:inline-flex;align-items:center;color:var(--muted);font-size:.9rem}
textarea.comment{width:100%;min-height:44px;resize:none;overflow:hidden;border:1px solid var(--border);border-radius:var(--r-s);background:var(--surface);padding:10px 12px;line-height:1.45}
textarea.comment:focus{border-color:var(--beige);outline:none;box-shadow:0 0 0 2px var(--beige)}
details.det summary{min-height:44px;display:flex;align-items:center;cursor:pointer;color:var(--muted);font-weight:600}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 10px;font-size:.9rem}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.pc{margin:0 0 8px;padding-left:1.1em;font-size:.9rem}
.pc-h{font-size:.86rem;font-weight:700;margin-bottom:2px}
.back{display:inline-flex;align-items:center;min-height:44px;color:var(--muted);text-decoration:none;font-weight:600}
.cat-head{margin:4px 0 18px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.cat-h{font-size:1.7rem}
.cat-comment{margin-top:28px;max-width:720px}
.sec-h{font-size:1.2rem;margin:0 0 10px}
.done-bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--border);z-index:10}
.done-bar .btn{display:flex;width:100%;max-width:480px;margin:0 auto}

/* Blocks & Rows */
.block{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:0 0 16px}
details.block>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:10px;list-style:none}
details.block>summary::-webkit-details-marker{display:none}
details.block>summary::after{content:"▾";color:var(--muted);margin-left:auto}
details.block:not([open])>summary::after{content:"▸"}
.blk-h{font-size:1.3rem}
.grp{margin-top:14px}
.grp-h{font:700 .98rem var(--f-body);display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:4px}
.row{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--border);align-items:start}
.row.dim{opacity:.55}
.row-main{display:flex;flex-direction:column;gap:4px;min-width:0}
.row-t{font-weight:700;overflow-wrap:anywhere}
.row-t a{text-decoration:none}
.row-t a:hover{text-decoration:underline}
.row-meta{font-size:.86rem;color:var(--muted);overflow-wrap:anywhere}
.row-c{font-size:.9rem;white-space:pre-line}
.row-act{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.catc{font-size:.9rem;margin-top:6px;white-space:pre-line}
.sum{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.9rem;margin:8px 0}
.sum b{font-weight:700}
.check{display:inline-flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;font-weight:600;font-size:.9rem}
.check input{width:20px;height:20px;accent-color:var(--sage)}
.big{font:500 1.3rem var(--f-head)}
.hint{background:var(--note-bg);border:1px solid var(--border);border-radius:var(--r-s);padding:12px 14px;margin:0 0 16px;white-space:pre-line}
.hint.err{background:var(--rose-soft);border-color:var(--rose)}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}
.authbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin:0 0 16px;font-size:.9rem;color:var(--muted)}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}

/* Forms */
.fld{display:block;margin:0 0 12px}
.fld>span{display:block;font-weight:600;font-size:.88rem;margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;min-height:44px;border:1px solid var(--border);border-radius:var(--r-s);background:var(--surface);padding:10px 12px}
.fld textarea{resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--beige);box-shadow:0 0 0 2px var(--beige)}
.dimrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.prio{display:flex;gap:6px}
.prio .segbtn{flex:1}
.form{max-width:640px}

/* Modal & Toast */
.modal-bg{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{background:var(--surface);border-radius:var(--r) var(--r) 0 0;width:100%;max-width:640px;max-height:90vh;overflow:auto;padding:20px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}
@media(min-width:720px){.modal-bg{align-items:center}.modal{border-radius:var(--r)}}
.m-title{font-size:1.35rem;margin-bottom:12px}
.m-body p{margin-bottom:8px}
.m-body ul{margin:0 0 10px;padding-left:1.2em}
.m-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.m-text{width:100%;min-height:160px;border:1px solid var(--border);border-radius:var(--r-s);padding:10px;font-size:.85rem}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:60;width:min(92vw,480px);pointer-events:none}
.toast{background:var(--text);color:var(--surface);border-radius:var(--r-s);padding:10px 14px;font-size:.9rem;box-shadow:var(--shadow);pointer-events:auto}
.toast.err{background:var(--rose-soft);color:var(--text);border:1px solid var(--rose)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

    <span class="sync" id="sync" aria-live="polite"></span>
  </div>
  <div class="bar" role="img" aria-label="Fortschritt"><i id="bar"></i></div>
  <nav class="tabs" id="tabs" aria-label="Bereiche"></nav>
</header>
<main id="main"><p class="muted">Lade …</p></main>
<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>
<noscript><p class="hint">Bitte JavaScript aktivieren, um CozyNest zu nutzen.</p></noscript>

const $ = (sel, root) => (root || document).querySelector(sel);

const nowIso = () => new Date().toISOString();

}
const NF = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 1 });

  const p = [];
  if (isNum(d.w)) p.push('B ' + NF.format(d.w));
  if (isNum(d.d)) p.push('T ' + NF.format(d.d));
  if (isNum(d.h)) p.push('H ' + NF.format(d.h));
  return p.length ? p.join(' × ') + ' cm' : '';

const nameOf = it => (it && (it.name || it.title)) || (it && it.id) || '';
const shopOf = it => it.shop || hostOf(it.url) || 'Shop';

const prioOf = it => [1, 2, 3].includes(it.prio) ? it.prio : 2;

function slug(s) {
  return String(s || '').toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
    .normalize('NFKD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}
const isResearcher = () => !!(S.user && !S.user.isAnonymous);

const isOrdered = id => ordStatus(S.orders.get(id)) === 'bestellt';

/* ---------- URL-Bereinigung & IDs ---------- */
function parseHttp(input) {
  const s = safeUrl(typeof input === 'string' ? input : '');
  return s ? new URL(s) : null;
}
function cleanUrl(input) {
  const u = parseHttp(input); if (!u) return null;
  const host = u.hostname.toLowerCase().replace(/^www\./, '');
  const params = [...u.searchParams].filter(([k]) => !TRACKING.test(k));
  const qs = params.length ? '?' + new URLSearchParams(params).toString() : '';
  let path = u.pathname;
  if (path.length > 1) path = path.replace(/\/+$/, '');
  return 'https://' + host + path + qs;
}
function stripTracking(input) {
  const u = parseHttp(input); if (!u) return null;
  u.hash = '';
  for (const k of [...u.searchParams.keys()]) if (TRACKING.test(k)) u.searchParams.delete(k);
  return u.href;
}
function shopKey(host) {
  const parts = host.split('.').filter(Boolean);
  if (parts.length < 2) return slug(host).replace(/-/g, '') || 'shop';
  let i = parts.length - 2;
  if (parts.length > 2 && /^(co|com|org|net|ac|gv)$/.test(parts[i]) && parts[parts.length - 1].length === 2) i--;
  return (parts[i] || 'shop').toLowerCase().replace(/[^a-z0-9]/g, '') || 'shop';
}
function fnv8(s) {
  let x = 0x811c9dc5;
  for (const b of new TextEncoder().encode(s)) { x ^= b; x = Math.imul(x, 0x01000193) >>> 0; }
  return x.toString(16).padStart(8, '0');
}
const itemIdFor = clean => shopKey(new URL(clean).hostname) + '-' + fnv8(clean);
function findDup(clean) {
  for (const it of S.items.values()) if (cleanUrl(it.url) === clean) return it;
  return null;
}

function decOf(catId) {
  const d = S.dec.get(catId) || {};
  const favs = new Set(Array.isArray(d.favs) ? d.favs : []);
  if (typeof d.fav === 'string' && d.fav) favs.add(d.fav);
  const ok = new Set((Array.isArray(d.ok) ? d.ok : []).filter(x => !favs.has(x)));
  const no = new Set((Array.isArray(d.no) ? d.no : []).filter(x => !favs.has(x) && !ok.has(x)));
  return {
    favs, ok, no,
    c: d.c && typeof d.c === 'object' ? d.c : {},
    cc: typeof d.cc === 'string' ? d.cc : '',
    legacy: Object.prototype.hasOwnProperty.call(d, 'fav'),
    updatedAt: d.updatedAt

}

  return d.favs.has(it.id) ? 'fav' : d.ok.has(it.id) ? 'ok' : d.no.has(it.id) ? 'no' : null;
}

/* ================= Schreiben ================= */
const ref = path => S.fs.doc(S.db, ROOT + '/' + path);
async function track(p) {
  S.pending++; syncUi();
  try { return await p; } finally { S.pending--; syncUi(); }
}
async function write(path, data) {
  if (!S.fs) { noDb(); return false; }
  try { await track(S.fs.setDoc(ref(path), data, { merge: true })); return true; }
  catch (e) { fail('Speichern fehlgeschlagen', e); scheduleRender(); return false; }
}
async function removeDoc(path) {
  if (!S.fs) { noDb(); return false; }
  try { await track(S.fs.deleteDoc(ref(path))); return true; }
  catch (e) { fail('Löschen fehlgeschlagen', e); scheduleRender(); return false; }
}
function withTimeout(p, ms) {
  let t;
  const timer = new Promise((_, rej) => { t = setTimeout(() => { const e = new Error('Zeitüberschreitung beim Speichern'); e.code = 'timeout'; rej(e); }, ms); });
  return Promise.race([p, timer]).finally(() => clearTimeout(t));
}
/* ops: [{path, data, mergeFields?, del?}] – wirft bei Fehlern (Aufrufer zeigt Meldung) */
async function commitOps(ops, onProgress) {
  if (!S.fs) { const e = new Error('Keine Datenbankverbindung'); e.code = 'no-db'; throw e; }
  let done = 0;
  for (let i = 0; i < ops.length; i += 450) {
    const b = S.fs.writeBatch(S.db);
    const chunk = ops.slice(i, i + 450);
    for (const o of chunk) {
      if (o.del) b.delete(ref(o.path));
      else if (o.mergeFields) b.set(ref(o.path), o.data, { mergeFields: o.mergeFields });
      else b.set(ref(o.path), o.data, { merge: true });
    }
    await track(withTimeout(b.commit(), COMMIT_TIMEOUT_MS));
    done += chunk.length;
    if (onProgress) onProgress(done, ops.length);
  }
  return done;
}
function writeDecision(catId, patch) {
  const d = decOf(catId);
  const data = Object.assign({}, patch, { updatedAt: nowIso() });
  if (d.legacy && S.fs) {
    if (!('favs' in data)) data.favs = [...d.favs];
    data.fav = S.fs.deleteField();
  }
  return write('decisions/' + catId, data);
}
function setStatus(it, st) {
  const d = decOf(it.catId);
  const next = statusOf(it) === st ? null : st;
  const favs = [...d.favs].filter(x => x !== it.id);
  const ok = [...d.ok].filter(x => x !== it.id);
  const no = [...d.no].filter(x => x !== it.id);
  if (next === 'fav') favs.push(it.id);
  else if (next === 'ok') ok.push(it.id);
  else if (next === 'no') no.push(it.id);
  return writeDecision(it.catId, { favs, ok, no });
}

/* ---------- entprellte Texte (Kommentare) ---------- */
const timers = new Map();
function queueText(key, value, commit) {
  S.pendingText.set(key, value);
  S.commits.set(key, commit);
  clearTimeout(timers.get(key));
  timers.set(key, setTimeout(() => flushText(key), 1500));
}
async function flushText(key) {
  timers.delete(key);
  const commit = S.commits.get(key);
  if (!S.pendingText.has(key) || !commit) return;
  const value = S.pendingText.get(key);
  const ok = await commit(value);
  if (ok && S.pendingText.get(key) === value && !timers.has(key)) S.pendingText.delete(key);
}
function flushAll() {
  for (const key of [...timers.keys()]) { clearTimeout(timers.get(key)); flushText(key); }
}
function grow(el) { el.style.height = 'auto'; el.style.height = (el.scrollHeight + 2) + 'px'; }
function autoText(key, value, placeholder, commit) {
  const v = S.pendingText.has(key) ? S.pendingText.get(key) : (value || '');
  const ta = h('textarea', { class: 'comment', rows: 1, placeholder, 'aria-label': placeholder, value: v, dataset: { fkey: key } });
  ta.addEventListener('input', () => { grow(ta); queueText(key, ta.value, commit); });
  return ta;
}

/* ================= Zwischenablage & Download ================= */
async function copyText(text, okMsg) {
  if (navigator.clipboard && window.isSecureContext) {
    try { await navigator.clipboard.writeText(text); toast(okMsg); return; }
    catch (e) { console.error('[CozyNest] Clipboard-API fehlgeschlagen, nutze Ersatzweg', e); }
  }
  const ta = h('textarea', { class: 'offscreen', readonly: true, value: text });
  document.body.append(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); }
  catch (e) { console.error('[CozyNest] Kopieren fehlgeschlagen', e); }
  ta.remove();
  if (ok) toast(okMsg);
  else {
    toast('Automatisches Kopieren nicht möglich – Text bitte manuell kopieren (clipboard)', 'err');
    const m = h('textarea', { class: 'm-text', readonly: true, value: text });
    openModal('Text kopieren', [h('p', null, 'Alles markieren und kopieren:'), m], [{ label: 'Schließen', primary: true }]);
    m.select();
  }
}
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = h('a', { href: url, download: name, class: 'offscreen' });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

/* ================= Dialoge ================= */
function openModal(title, body, actions, onClose) {
  let closed = false;
  const close = () => {
    if (closed) return; closed = true;
    bg.remove(); document.removeEventListener('keydown', onKey);
    if (onClose) onClose();
  };
  const onKey = e => { if (e.key === 'Escape') close(); };
  const foot = h('div', { class: 'm-foot' });
  const box = h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
    h('h2', { class: 'm-title' }, title), h('div', { class: 'm-body' }, body), foot);
  for (const a of actions || []) {
    const b = h('button', { class: 'btn' + (a.primary ? ' primary' : ''), type: 'button' }, a.label);
    b.addEventListener('click', async () => {
      b.disabled = true;
      const r = a.onClick ? await a.onClick() : undefined;
      b.disabled = false;
      if (r !== false) close();
    });
    foot.append(b);
  }
  const bg = h('div', { class: 'modal-bg' }, box);
  bg.addEventListener('click', e => { if (e.target === bg) close(); });
  $('#modal-root').append(bg);
  document.addEventListener('keydown', onKey);
  const f = box.querySelector('input:not([type=hidden]),textarea,select') || foot.lastElementChild;
  if (f) f.focus();
  return { close, box };
}
function confirmDlg(title, body, okLabel) {
  return new Promise(res => {
    let answered = false;
    openModal(title, body, [
      { label: 'Abbrechen', onClick: () => { answered = true; res(false); } },
      { label: okLabel || 'Bestätigen', primary: true, onClick: () => { answered = true; res(true); } }

  });
}

async function saveItem(it, ctrls, fNote, fPrio, fCat) {
  if (!requireResearcher()) return false;
  const data = {}, edited = {}, flags = {};
  const norm = v => JSON.stringify(v === undefined ? null : v);
  for (const [k, label, type] of EDIT_FIELDS) {
    let nv;
    if (type === 'dims') {
      const o = {};
      for (const x of ['w', 'd', 'h']) {
        const n = parseNum(ctrls[k][x].value);
        if (Number.isNaN(n)) { toast(label + ': „' + ctrls[k][x].value + '“ ist keine Zahl.', 'err'); return false; }
        if (n !== null) o[x] = n;
      }
      nv = Object.keys(o).length ? o : null;
      const od = it.dims && typeof it.dims === 'object' ? { w: it.dims.w, d: it.dims.d, h: it.dims.h } : null;
      const odn = od ? Object.fromEntries(Object.entries(od).filter(([, v]) => isNum(v))) : null;
      if (norm(nv) === norm(odn && Object.keys(odn).length ? odn : null)) continue;
    } else if (type === 'num') {
      nv = parseNum(ctrls[k].value);
      if (Number.isNaN(nv)) { toast(label + ': „' + ctrls[k].value + '“ ist keine Zahl.', 'err'); return false; }
      if (norm(nv) === norm(isNum(it[k]) ? it[k] : null)) continue;
    } else if (type === 'lines') {
      nv = ctrls[k].value.split('\n').map(s => s.trim()).filter(Boolean);
      if (k === 'images') {
        const bad = nv.filter(u => !safeUrl(u));
        if (bad.length) { toast('Ungültige Bild-URL: ' + bad[0], 'err'); return false; }
      }
      if (norm(nv) === norm(Array.isArray(it[k]) ? it[k] : [])) continue;
    } else {
      nv = ctrls[k].value.trim() || null;
      if (norm(nv) === norm(it[k] == null ? null : String(it[k]))) continue;
    }
    data[k] = nv; edited[k] = true; flags[k] = 'MANUELL';
  }
  if (Object.keys(edited).length) { data.edited = edited; data.flags = flags; }
  const oldNote = typeof it.note === 'string' ? it.note : '';
  if (fNote.value !== oldNote) data.note = fNote.value === '' ? null : fNote.value;
  const p = Number(fPrio.value);
  if (p !== it.prio) data.prio = p;
  if (fCat.value && fCat.value !== it.catId) data.catId = fCat.value;
  if (!Object.keys(data).length) return true;
  const ok = await write('items/' + it.id, data);
  if (ok) toast('Gespeichert');
  return ok;
}

function validateImport(o) {
  if (!o || typeof o !== 'object' || Array.isArray(o)) return 'kein JSON-Objekt';
  if (o.v !== 3) return 'Version ' + o.v + ' statt 3';
  if (!['enrich', 'preise', 'full'].includes(o.kind)) return 'unbekannte Art „' + o.kind + '“';
  if (!Array.isArray(o.items)) return 'Liste „items“ fehlt';
  const badId = x => !x || typeof x !== 'object' || typeof x.id !== 'string' || !x.id || x.id.includes('/');
  const bi = o.items.findIndex(badId);
  if (bi >= 0) return 'Item Nr. ' + (bi + 1) + ' ohne gültige ID';
  if (o.kind === 'full') {
    if (o.categories !== undefined && !Array.isArray(o.categories)) return '„categories“ ist keine Liste';
    const bc = (o.categories || []).findIndex(badId);
    if (bc >= 0) return 'Kategorie Nr. ' + (bc + 1) + ' ohne gültige ID';
  }
  return '';
}
function planImport(o) {
  const ops = [];
  if (o.kind === 'full') {
    let created = 0;
    for (const c of o.categories || []) { const data = Object.assign({}, c); delete data.id; ops.push({ path: 'categories/' + c.id, data }); }
    for (const it of o.items) { const data = Object.assign({}, it); delete data.id; ops.push({ path: 'items/' + it.id, data }); if (!S.items.has(it.id)) created++; }
    return { ops, catCount: (o.categories || []).length, itemCount: o.items.length, created, activated: 0, updated: o.items.length - created, unknown: [] };
  }
  const fields = o.kind === 'preise' ? PRICE_FIELDS : ENRICH_FIELDS;
  let activated = 0, updated = 0;
  const unknown = [];
  for (const src of o.items) {
    const cur = S.items.get(src.id);
    if (!cur) { unknown.push(src.id); continue; }
    const ed = cur.edited && typeof cur.edited === 'object' ? cur.edited : {};
    const data = {}, mf = [];
    for (const f of fields) {
      if (!Object.prototype.hasOwnProperty.call(src, f) || ed[f]) continue;
      data[f] = src[f]; mf.push(f);
    }
    if (src.flags && typeof src.flags === 'object') {
      const fl = {};
      for (const [k, v] of Object.entries(src.flags)) {
        if (ed[k] || !/^[A-Za-z0-9_]+$/.test(k) || typeof v !== 'string') continue;
        if (o.kind === 'preise' && !PRICE_FIELDS.includes(k)) continue;
        fl[k] = v; mf.push('flags.' + k);
      }
      if (Object.keys(fl).length) data.flags = fl;
    }
    if (cur.state === 'neu') { data.state = 'aktiv'; mf.push('state'); activated++; } else updated++;
    if (mf.length) ops.push({ path: 'items/' + src.id, data, mergeFields: mf });
  }
  return { ops, catCount: 0, itemCount: ops.length, activated, updated, unknown };
}
async function startImport(f) {

  if (!S.server.items || !S.server.categories) { setImportLog('Der Katalog ist noch nicht vollständig vom Server geladen – bitte kurz warten und erneut importieren.', true); return; }
  let o;
  try { o = JSON.parse(await f.text()); }
  catch (e) { console.error('[CozyNest] Import: JSON ungültig', e); setImportLog('Die Datei ist kein gültiges JSON (' + (e.name || 'SyntaxError') + ').', true); return; }
  const err = validateImport(o);
  if (err) { setImportLog('Ungültiges Format: ' + err + '.', true); return; }
  const p = planImport(o);
  const body = o.kind === 'full'
    ? [h('p', null, 'Vollimport: ' + p.catCount + ' Kategorien · ' + p.itemCount + ' Items (' + p.created + ' neu, ' + p.updated + ' vorhanden).')]
    : [h('p', null, p.activated + ' aktiviert · ' + p.updated + ' aktualisiert · ' + p.unknown.length + ' unbekannte IDs'),
       h('p', { class: 'muted small' }, 'Art: ' + o.kind + (o.ts ? ' · erstellt ' + fmtDate(o.ts) : '') + ' · manuell geänderte Felder bleiben unverändert.'),
       p.unknown.length ? h('p', { class: 'vhint' }, 'Übersprungen (nicht im Katalog): ' + p.unknown.slice(0, 10).join(', ') + (p.unknown.length > 10 ? ' …' : '')) : null];
  if (!p.ops.length) { setImportLog('Nichts zu schreiben: ' + p.unknown.length + ' unbekannte IDs.', true); return; }
  if (!await confirmDlg('Import prüfen', body, 'Bestätigen')) { setImportLog('Import abgebrochen.'); return; }
  if (o.kind === 'full' && !await confirmDlg('Vollimport bestätigen', [h('p', null, 'Ein Vollimport schreibt auch Notiz, Prio, Kategorie und Status. Vorhandene Werte werden überschrieben.')], 'Ja, alles schreiben')) { setImportLog('Import abgebrochen.'); return; }
  setImportLog('Schreibe 0/' + p.ops.length + ' …' + (navigator.onLine ? '' : ' (offline – wartet auf Verbindung)'));
  try {
    await commitOps(p.ops, (d, t) => setImportLog('Schreibe ' + d + '/' + t + ' …'));
    const msg = p.catCount + ' Kategorien, ' + p.itemCount + ' Items geschrieben' + (p.activated ? ' · ' + p.activated + ' aktiviert' : '') + (p.unknown.length ? ' · ' + p.unknown.length + ' unbekannte IDs übersprungen' : '');
    setImportLog(msg); toast(msg);
  } catch (e) {

    toast(errText('Import fehlgeschlagen', e), 'err');
  }
}

function ingest(col, snap) {
  const docs = snap.docs.map(d => Object.assign({}, d.data(), { id: d.id }));
  if (col === 'categories') S.cats = new Map(docs.map(d => [d.id, d]));
  else if (col === 'items') S.items = new Map(docs.map(d => [d.id, d]));
  else if (col === 'decisions') S.dec = new Map(docs.map(d => [d.id, d]));
  else if (col === 'orders') S.orders = new Map(docs.map(d => [d.id, d]));
  else if (col === 'progress') S.progress = docs.find(d => d.id === 'state') || {};
  S.loaded[col] = true;
  if (!snap.metadata.fromCache) S.server[col] = true;
  if (S.dbSoft) { S.dbSoft = false; S.dbError = ''; }
  maybeMigrateLocal();
  scheduleRender();
}
function subscribeAll() {
  for (const col of COLS) {
    if (S.subs[col]) continue;
    S.subs[col] = S.fs.onSnapshot(S.fs.collection(S.db, ROOT, col),
      snap => ingest(col, snap),
      err => { S.subs[col] = null; fail('Laden von „' + col + '“ fehlgeschlagen', err); });
  }
}
function maybeMigrateLocal() {
  if (S.migrated || !S.fs) return;
  if (!(S.server.categories && S.server.items && S.server.decisions)) return;
  S.migrated = true;
  const raw = lsGet(LS_OLD);
  if (!raw) return;
  let st;
  try { st = JSON.parse(raw); }
  catch (e) { console.error('[CozyNest] Alter Bewertungsstand unlesbar', e); toast('Alter Bewertungsstand auf diesem Gerät ist unlesbar und wurde nicht übernommen (' + e.name + ')', 'err'); return; }
  const src = st && typeof st === 'object' ? (st.decisions || st.d || st) : {};
  const arr = v => Array.isArray(v) ? v.filter(x => typeof x === 'string' && S.items.has(x)) : [];
  const ops = [];
  for (const [catId, d] of Object.entries(src || {})) {
    if (!S.cats.has(catId) || !d || typeof d !== 'object') continue;
    const cur = S.dec.get(catId);
    const curD = decOf(catId);
    if (cur && (curD.favs.size || curD.ok.size || curD.no.size || curD.cc || Object.keys(curD.c).length)) continue;
    const favs = [...new Set(arr(d.favs).concat(typeof d.fav === 'string' && S.items.has(d.fav) ? [d.fav] : []))];
    const ok = arr(d.ok).filter(x => !favs.includes(x));
    const no = arr(d.no).filter(x => !favs.includes(x) && !ok.includes(x));
    const c = {};
    if (d.c && typeof d.c === 'object') for (const [k, v] of Object.entries(d.c)) if (typeof v === 'string' && v) c[k] = v;
    const cc = typeof d.cc === 'string' ? d.cc : '';
    if (!favs.length && !ok.length && !no.length && !cc && !Object.keys(c).length) continue;
    ops.push({ path: 'decisions/' + catId, data: { favs, ok, no, c, cc, updatedAt: nowIso() } });
  }
  if (!ops.length) { lsSet(LS_OLD, null); return; }
  commitOps(ops)
    .then(() => { lsSet(LS_OLD, null); toast('Frühere Bewertungen dieses Geräts übernommen (' + ops.length + ' Kategorien)'); })
    .catch(e => fail('Übernahme früherer Bewertungen fehlgeschlagen', e));
}
async function initFirebase() {
  try {
    const mods = await Promise.all([import(FB_BASE + 'firebase-app.js'), import(FB_BASE + 'firebase-auth.js'), import(FB_BASE + 'firebase-firestore.js')]);
    const [appM, au, fs] = mods;
    const app = appM.initializeApp(CONFIG.firebaseConfig);
    const db = fs.initializeFirestore(app, {
      localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }),
      ignoreUndefinedProperties: true
    });
    const auth = au.getAuth(app);
    Object.assign(S, { fs, au, db, auth });
    syncUi();
    try { await au.setPersistence(auth, au.browserLocalPersistence); }
    catch (e) { fail('Anmeldung kann nicht dauerhaft gespeichert werden', e); }
    au.onAuthStateChanged(auth, user => {
      S.user = user; S.authReady = true;
      if (!user) {
        au.signInAnonymously(auth).catch(e => {
          S.dbError = 'Anmeldung fehlgeschlagen – Daten können nicht geladen werden. ' + errText('Anmeldung fehlgeschlagen', e);
          fail('Anonyme Anmeldung fehlgeschlagen', e); render();
        });
      } else subscribeAll();
      render();
    });
    setTimeout(() => {
      if (!S.loaded.items && !S.dbError) { S.dbError = 'Die Datenbank antwortet nicht. Es wird weiter versucht – bitte Internetverbindung prüfen.'; S.dbSoft = true; render(); }
    }, 12000);
  } catch (e) {
    console.error('[CozyNest] Firebase SDK konnte nicht geladen werden', e);
    S.dbError = 'Keine Verbindung zur Datenbank. Bitte Internetverbindung prüfen und die Seite neu laden.';
    toast('Datenbank nicht erreichbar (' + (e.code || e.name || 'load-failed') + ')', 'err');
    render();
  }
}

/* ================= Darstellung ================= */
function route() {
  const p = new URLSearchParams(location.hash.replace(/^#/, ''));
  const mode = p.get('mode');
  return {
    mode: ['order', 'edit', 'add'].includes(mode) ? mode : 'decide',
    cat: p.get('cat'), tab: p.get('tab') || 'eingang', item: p.get('item'),
    u: p.get('u') || '', t: p.get('t') || ''
  };
}
let rq = 0;
function scheduleRender() { if (rq) return; rq = requestAnimationFrame(() => { rq = 0; render(); }); }
function captureFocus() {
  const a = document.activeElement;
  if (!a || !a.dataset || !a.dataset.fkey) return null;
  return { key: a.dataset.fkey, s: a.selectionStart, e: a.selectionEnd };
}
function restoreFocus(f) {
  if (!f) return;
  const el = [...document.querySelectorAll('[data-fkey]')].find(x => x.dataset.fkey === f.key);
  if (!el) return;
  el.focus({ preventScroll: true });
  if (f.s !== null && f.s !== undefined && typeof el.setSelectionRange === 'function' && el.selectionStart !== null) el.setSelectionRange(f.s, f.e);
}
function render() {
  const r = route();
  const main = $('#main');
  const f = captureFocus();
  const { withFav, total } = favProgress();
  $('#bar').style.width = total ? (withFav / total * 100).toFixed(1) + '%' : '0%';
  $('#bar').parentElement.setAttribute('aria-label', withFav + ' von ' + total + ' Kategorien mit Favorit');
  $('#tabs').replaceChildren(...TABS.map(t => h('a', { class: 'tab' + (t.mode === r.mode ? ' on' : ''), href: t.href, 'aria-current': t.mode === r.mode ? 'page' : null }, t.label)));
  syncUi();
  let kids;
  try {
    kids = r.mode === 'order' ? viewOrder() : r.mode === 'edit' ? viewEdit(r) : r.mode === 'add' ? viewAdd(r) : r.cat ? viewCategory(r.cat) : viewDecideHome();
  } catch (e) {
    console.error('[CozyNest] Darstellungsfehler', e);
    kids = [h('div', { class: 'hint err', role: 'alert' }, 'Darstellungsfehler: ' + (e && e.message || e))];
    toast('Darstellungsfehler (' + (e && e.name || 'Error') + ')', 'err');
  }
  main.replaceChildren(...[statusBanner(), kids].flat(Infinity).filter(x => x instanceof Node));
  restoreFocus(f);
  requestAnimationFrame(() => document.querySelectorAll('textarea.comment').forEach(grow));
  if (r.mode === 'edit' && r.item && S.openedItem !== location.hash && isResearcher()) {
    const it = S.items.get(r.item);
    if (it) { S.openedItem = location.hash; itemModal(it); }
  }
}

/* ================= Start ================= */
function init() {
  S.prevVisit = Number(lsGet(LS_VISIT)) || 0;
  const leave = () => { lsSet(LS_VISIT, String(Date.now())); flushAll(); };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') leave(); });
  window.addEventListener('pagehide', leave);
  window.addEventListener('hashchange', () => {
    S.scroll[S.lastHash] = window.scrollY;
    S.lastHash = location.hash;
    render();
    window.scrollTo(0, S.scroll[location.hash] || 0);
  });
  window.addEventListener('error', e => { console.error('[CozyNest] Unerwarteter Fehler', e.error || e.message); toast('Unerwarteter Fehler: ' + ((e.error && e.error.message) || e.message || 'unbekannt'), 'err'); });
  window.addEventListener('unhandledrejection', e => { console.error('[CozyNest] Unbehandelter Fehler', e.reason); toast(errText('Unerwarteter Fehler', e.reason), 'err'); });
  window.addEventListener('online', syncUi);
  window.addEventListener('offline', syncUi);
  render();
  initFirebase();
}
window.CozyNest = { version: APP_VERSION, S, render, _ingest: ingest, _cleanUrl: cleanUrl, _itemIdFor: itemIdFor, _planImport: planImport, _enrichText: enrichText };
init();
})();
</script>
