<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FBFAF7">
<title>CozyNest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#FBFAF7;--surface:#FFFDF8;--sand:#EFE7DA;--beige:#E3D8C6;--border:#E8E0D2;
  --text:#3A3835;--muted:#8A857D;--sage:#8FA088;--sage-soft:#E3EADF;--rose:#B98589;--rose-soft:#F2E1DE;
  --note-bg:#F3EDE2;--img-bg:#FFFFFF;
  --shadow:0 2px 14px rgba(40,38,35,.06);--r:16px;
  --f-head:"Fraunces",Georgia,serif;--f-body:"Nunito Sans",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.55 var(--f-body);padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-head);font-weight:500;line-height:1.2;margin:0}
h2{font-size:1.5rem}h3{font-size:1.125rem}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.top{padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:6px}
.brand{display:flex;justify-content:space-between;align-items:flex-end;gap:6px 16px;flex-wrap:wrap}
.brand h1{font-size:2.125rem;letter-spacing:-.01em}
.sub,.muted{color:var(--muted)}
.sync{font-size:.8125rem;color:var(--muted);padding-bottom:4px}
.bar{height:4px;background:var(--sand);border-radius:4px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--sage);border-radius:4px;transition:width .5s ease}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.modenav{margin-top:10px}
.pills a{min-height:44px;display:inline-flex;align-items:center;padding:6px 14px;border-radius:999px;text-decoration:none;color:var(--muted);border:1px solid transparent}
.pills a[aria-current="page"]{background:var(--sand);color:var(--text);border-color:var(--border)}
main{padding-top:14px}
.section{margin:30px 0 12px}
.section>h2,.sechead{margin-bottom:12px}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.room{margin:30px 0 14px;font-size:1.375rem}
.lead{font-size:1.0625rem}
.btn{min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid var(--border);background:var(--sand);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-weight:600;line-height:1.2}
.btn:hover{background:var(--beige)}
.btn.primary{background:var(--text);border-color:var(--text);color:var(--surface)}
.btn.primary:hover{background:var(--text);opacity:.88}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:720px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card.dim{opacity:.55}
.pad{padding:16px}
.stack{display:grid;gap:10px}
.media{position:relative}
.imgbox{aspect-ratio:4/3;background:var(--img-bg);padding:8px}
.imgbox img{width:100%;height:100%;object-fit:contain;display:block}
.imgfb{display:flex;width:100%;height:100%;align-items:center;justify-content:center;color:var(--muted);font-size:.8125rem;text-decoration:none}
.mini{width:56px;height:42px;background:var(--img-bg);border:1px solid var(--border);border-radius:8px;overflow:hidden;flex:none}
.mini img{width:100%;height:100%;object-fit:contain;display:block}
.badge{position:absolute;top:10px;padding:4px 10px;border-radius:999px;font-size:.8125rem;font-weight:700;border:1px solid var(--border);background:var(--surface)}
.badge.r{right:10px}.badge.l{left:10px}
.badge.rec{background:var(--sage-soft);border-color:var(--sage)}
.badge.new{background:var(--rose-soft);border-color:var(--rose)}
.badge.ord{background:var(--sage-soft);border-color:var(--sage)}
.badge.l2{left:10px;top:44px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;background:var(--sand);border:1px solid var(--border);font-size:.8125rem;font-weight:600;max-width:100%}
.chip.fav{background:var(--rose-soft);border-color:var(--rose)}
.chip.ok{background:var(--sage-soft);border-color:var(--sage)}
.chip.no{color:var(--muted)}
.chip.info{background:var(--rose-soft);border-color:var(--rose);font-weight:400}
.chip.gap{background:var(--rose-soft);border-color:var(--rose)}
.tile{text-decoration:none;color:inherit}
.tile:hover{border-color:var(--beige)}
.tile .pad{display:grid;gap:4px}
.status{display:flex;align-items:center;gap:8px;min-height:34px}
.status .mini{width:34px;height:34px}
.prod .pad{display:grid;gap:10px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pname{font-weight:700;font-size:1.0625rem;line-height:1.3}
.price{font-family:var(--f-head);font-size:1.5rem}
.price.unk{font-family:var(--f-body);font-size:1rem;color:var(--muted)}
.hint{color:var(--rose);font-size:.875rem}
.note{background:var(--note-bg);border-left:4px solid var(--sage);border-radius:10px;padding:10px 12px}
.note strong{display:block;margin-bottom:2px}
.note-text{white-space:pre-line;overflow-wrap:anywhere}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.segb{min-height:44px;border-radius:12px;border:1px solid var(--border);background:var(--sand);cursor:pointer;font-weight:600;padding:6px 4px}
.segb:hover{background:var(--beige)}
.segb .ic{color:var(--muted)}
.segb.fav.on{background:var(--rose-soft);border-color:var(--rose)}.segb.fav.on .ic{color:var(--rose)}
.segb.ok.on{background:var(--sage-soft);border-color:var(--sage)}.segb.ok.on .ic{color:var(--sage)}
.segb.no.on{background:var(--sand);border-color:var(--beige)}
.golink{justify-self:start;min-height:44px;display:inline-flex;align-items:center;font-weight:600;text-underline-offset:3px}
.cmt{width:100%;min-height:44px;resize:none;overflow:hidden;border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--surface)}
details.more>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:8px}
.thumbs .imgbox{border:1px solid var(--border);border-radius:10px;padding:4px}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:6px 0}
dl.facts dt{color:var(--muted)}dl.facts dd{margin:0}
ul.pc{margin:2px 0 8px;padding-left:18px}
.donebar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--border);display:flex;justify-content:center;z-index:5}
.donebar .btn{min-width:240px}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:60;width:min(560px,calc(100% - 24px))}
.toast{background:var(--text);color:var(--surface);padding:12px 14px;border-radius:12px;box-shadow:var(--shadow);font-size:.9375rem;overflow-wrap:anywhere}
.toast.err{background:var(--rose-soft);color:var(--text);border:1px solid var(--rose)}
.toast.ok{background:var(--sage-soft);color:var(--text);border:1px solid var(--sage)}
.dlg{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);color:var(--text);padding:20px;width:min(640px,calc(100% - 24px));max-height:calc(100% - 32px);box-shadow:var(--shadow)}
.dlg::backdrop{background:color-mix(in srgb,var(--text) 35%,transparent)}
.dlg>h2{margin-bottom:12px}
.dlg-body{display:grid;gap:12px}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:18px}
.notice{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--rose-soft);border:1px solid var(--rose)}
.field{display:grid;gap:4px}
.field>span{font-weight:600;font-size:.875rem}
.inp{width:100%;min-height:44px;border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--surface)}
textarea.inp{resize:vertical}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.list{display:grid;gap:10px}
.line{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:12px}
.line.dim{opacity:.55}
.line .meta{display:grid;gap:4px;min-width:0;flex:1}
.url{overflow-wrap:anywhere;color:var(--muted);font-size:.8125rem}
.tabs{margin:6px 0 16px}
.authbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 8px 8px 14px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:14px}
.check{display:inline-flex;align-items:center;gap:8px;min-height:44px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--sage)}
.empty{padding:32px 16px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.prog{font-weight:700}
.log{display:grid;gap:4px;font-size:.875rem;max-height:260px;overflow:auto}
.log .err{color:var(--rose)}
.hl{outline:2px solid var(--rose);outline-offset:2px}
table.t{border-collapse:collapse;width:100%}
table.t td{padding:6px 0;border-bottom:1px solid var(--border);vertical-align:top}
table.t td:last-child{text-align:right;font-weight:700;padding-left:12px}
.prios{display:flex;gap:6px}
.prios label{flex:1}
.prios input{position:absolute;opacity:0;pointer-events:none}
.prios span{display:flex;min-height:44px;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:12px;background:var(--sand);cursor:pointer;font-weight:600}
.prios input:checked+span{background:var(--sage-soft);border-color:var(--sage)}
.prios input:focus-visible+span{outline:2px solid var(--sage);outline-offset:2px}
.sum{font-weight:700;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">
    <div><h1>CozyNest</h1><p class="sub">Unsere Auswahl für die neue Wohnung</p></div>
    <span id="sync" class="sync" aria-live="polite">verbinde …</span>
  </div>
  <nav id="modenav" class="pills modenav" hidden></nav>
  <div class="bar" aria-hidden="true"><i id="barfill"></i></div>
</div></header>
<div id="notice" class="wrap"></div>
<main id="app" class="wrap"></main>
<div id="donebar" class="donebar" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<dialog id="dlg" class="dlg"></dialog>
<input id="impFile" type="file" accept=".json,application/json" hidden>
<script type="module">
/* CozyNest v3.1 – eine Datei, Daten live in Firestore. */
const CONFIG = {"firebaseConfig":{"apiKey":"AIzaSyCtrdbLPlQuPPQ4o6qI9Lioe6oMKt74--I","authDomain":"cozynest-shortlist.firebaseapp.com","projectId":"cozynest-shortlist","storageBucket":"cozynest-shortlist.firebasestorage.app","messagingSenderId":"983869338234","appId":"1:983869338234:web:df26b7c4772efc73d5c1c3"},"listId":"7c7cxdk5pxj23z34jj8l"};
const SDK_VERSION = '12.19.0';
const SDK = `https://www.gstatic.com/firebasejs/${SDK_VERSION}/`;

/*CORE-BEGIN*/
const RESEARCHER_FIELDS = ['catId','url','title','note','prio','state','addedAt','edited'];
const ENRICH_FIELDS = ['name','shop','price','articleNo','dims','material','color','images','summary','deliveryTime','availability','pros','cons','flags','vorgabeCheck','fetchedAt','hints'];
const PRICE_FIELDS = ['price','availability','fetchedAt'];
const CAT_FIELDS = ['room','name','vorgabe','sort','createdAt'];
const STATES = ['neu','aktiv','archiviert'];
const GAP_FLAGS = ['LÜCKE','UNSICHER','BLOCKIERT'];
const BATCH_MAX = 450;
const TRACKING = /^(utm_.*|gclid|gbraid|wbraid|dclid|fbclid|msclkid|yclid|igshid|mc_cid|mc_eid|_ga|_gl|srsltid|pk_.*|mtm_.*|matomo_.*|wt_mc|wt\.mc_id|emc|awc|sc_cid|affid|trk|ref_src)$/i;

const isObj = v => v !== null && typeof v === 'object' && !Array.isArray(v);
const validDocId = id => typeof id === 'string' && id.length > 0 && id.length <= 700 && !id.includes('/') && id !== '.' && id !== '..' && !/^__.*__$/.test(id);

function toMs(v){
  if (v == null) return 0;
  if (typeof v === 'number') return v;
  if (typeof v.toMillis === 'function') return v.toMillis();
  if (typeof v === 'string'){ const t = Date.parse(v); return isNaN(t) ? 0 : t; }
  if (isObj(v) && typeof v.seconds === 'number') return v.seconds * 1000;
  return 0;
}
const prioOf = i => [1,2,3].includes(i && i.prio) ? i.prio : 2;
const byPrio = (a,b) => prioOf(a) - prioOf(b) || toMs(a.addedAt) - toMs(b.addedAt) || String(a.id).localeCompare(String(b.id));
function filterActive(list, catId){ return list.filter(i => i && i.state === 'aktiv' && (!catId || i.catId === catId)).sort(byPrio); }

function cleanUrl(raw){
  const u = new URL(String(raw).trim());
  if (!/^https?:$/.test(u.protocol)) throw new Error('Nur http(s)-Links');
  u.hash = '';
  for (const k of [...new Set(u.searchParams.keys())]) if (TRACKING.test(k)) u.searchParams.delete(k);
  const q = u.searchParams.toString();
  const host = u.hostname.toLowerCase().replace(/^www\./, '');
  return {
    url: u.origin + u.pathname + (q ? '?' + q : ''),
    key: u.protocol + '//' + host + (u.port ? ':' + u.port : '') + (u.pathname.replace(/\/+$/, '') || '/') + (q ? '?' + q : ''),
    host
  };
}
function shopCode(host){
  const p = String(host).toLowerCase().replace(/^www\./, '').split('.');
  const lbl = p.length >= 3 && /^(co|com|net|org|gov|ac)$/.test(p[p.length-2]) ? p[p.length-3] : (p.length >= 2 ? p[p.length-2] : p[0]);
  return (lbl || '').replace(/[^a-z0-9]/g, '') || 'shop';
}
function fnv8(s){
  let h = 0x811c9dc5;
  for (const b of new TextEncoder().encode(s)){ h ^= b; h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(16).padStart(8, '0');
}
function makeItemId(raw){ const c = cleanUrl(raw); return shopCode(c.host) + '-' + fnv8(c.key); }
function slug(s){
  return String(s || '').toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
    .normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'x';
}
const catIdFor = (room, name) => `k-${slug(room)}-${slug(name)}`;

function applyStatus(d, id, status){
  const cur = d.fav === id ? 'fav' : (d.ok||[]).includes(id) ? 'ok' : (d.no||[]).includes(id) ? 'no' : null;
  let fav = d.fav === id ? null : (d.fav || null);
  const ok = (d.ok||[]).filter(x => x !== id), no = (d.no||[]).filter(x => x !== id);
  if (cur !== status){
    if (status === 'fav'){ if (fav && !ok.includes(fav)) ok.push(fav); fav = id; }
    else if (status === 'ok') ok.push(id);
    else if (status === 'no') no.push(id);
  }
  return { fav, ok: ok.filter(x => x !== fav), no: no.filter(x => x !== fav) };
}

function fieldError(k, v){
  if (v === null) return null;
  switch (k){
    case 'price': return (typeof v === 'number' && isFinite(v)) || typeof v === 'string' ? null : 'ist keine Zahl';
    case 'prio': return [1,2,3].includes(v) ? null : 'muss 1, 2 oder 3 sein';
    case 'images': case 'pros': case 'cons': return Array.isArray(v) && v.every(x => typeof x === 'string') ? null : 'muss eine Textliste sein';
    case 'dims': return isObj(v) && Object.values(v).every(x => x == null || typeof x === 'number') ? null : 'muss {w,d,h} in cm sein';
    case 'flags': case 'edited': case 'vorgabeCheck': case 'hints': return isObj(v) ? null : 'muss ein Objekt sein';
    default: return ['string','number','boolean'].includes(typeof v) ? null : 'hat einen ungültigen Typ';
  }
}

/* Prüft eine Import-Datei gegen den aktuellen Bestand (cur = {cats: Map, items: Map}). Schreibt nichts. */
function validateImport(data, cur){
  const errors = [], warnings = [];
  const r = { ok:false, kind:null, errors, warnings, categories:[], items:[], unknownIds:[],
    stats:{ cats:0, items:0, catsNew:0, catsUpdated:0, created:0, updated:0, activated:0, archived:0, unknown:0 } };
  if (!isObj(data)){ errors.push('Die Datei enthält kein JSON-Objekt.'); return r; }
  if (data.v !== 3) errors.push(`Formatversion ${JSON.stringify(data.v)} – erwartet wird v: 3.`);
  const kind = data.kind; r.kind = kind;
  if (!['full','enrich','preise'].includes(kind)) errors.push(`Unbekannter Typ kind=${JSON.stringify(kind)} – erwartet full, enrich oder preise.`);
  if (!Array.isArray(data.items)) errors.push('„items“ fehlt oder ist keine Liste.');
  if (kind === 'full' && !Array.isArray(data.categories)) errors.push('„categories“ fehlt – bei kind "full" Pflicht.');
  if (errors.length) return r;

  const catIds = new Set();
  if (kind === 'full') data.categories.forEach((c, n) => {
    const at = `categories[${n}]`;
    if (!isObj(c)){ errors.push(`${at}: kein Objekt`); return; }
    const id = c.id ?? c.catId;
    if (!validDocId(id)){ errors.push(`${at}: ungültige ID ${JSON.stringify(id)}`); return; }
    if (catIds.has(id)){ errors.push(`${at}: ID ${id} doppelt`); return; }
    catIds.add(id);
    if (typeof c.room !== 'string' || !c.room.trim()) errors.push(`${id}: „room“ fehlt`);
    if (typeof c.name !== 'string' || !c.name.trim()) errors.push(`${id}: „name“ fehlt`);
    if (c.vorgabe != null && typeof c.vorgabe !== 'string') errors.push(`${id}: „vorgabe“ muss Text oder null sein`);
    const out = { id };
    for (const f of CAT_FIELDS){
      if (c[f] === undefined) continue;
      if (f === 'sort' && c[f] != null && typeof c[f] !== 'number'){ warnings.push(`${id}: sort ist keine Zahl – ignoriert`); continue; }
      out[f] = c[f];
    }
    r.categories.push(out);
    cur.cats.has(id) ? r.stats.catsUpdated++ : r.stats.catsNew++;
  });

  const seen = new Set();
  const allowed = kind === 'full' ? [...RESEARCHER_FIELDS, ...ENRICH_FIELDS] : kind === 'preise' ? [...PRICE_FIELDS, 'flags'] : ENRICH_FIELDS;
  data.items.forEach((it, n) => {
    const at = `items[${n}]`;
    if (!isObj(it)){ errors.push(`${at}: kein Objekt`); return; }
    const id = it.id;
    if (!validDocId(id)){ errors.push(`${at}: ungültige ID ${JSON.stringify(id)}`); return; }
    if (seen.has(id)){ errors.push(`${at}: ID ${id} doppelt`); return; }
    seen.add(id);
    const ex = cur.items.get(id);
    if (kind !== 'full' && !ex){ r.stats.unknown++; r.unknownIds.push(id); return; }
    const out = { id }, dropped = [];
    for (const [k, v] of Object.entries(it)){
      if (k === 'id' || v === undefined) continue;
      if (!allowed.includes(k)){ dropped.push(k); continue; }
      const e = fieldError(k, v);
      if (e){ warnings.push(`${id}: ${k} ${e} – ignoriert`); continue; }
      out[k] = v;
    }
    if (dropped.length) warnings.push(`${id}: nicht übernommen: ${dropped.join(', ')}`);
    if (kind === 'full'){
      if (typeof out.catId !== 'string' || !(catIds.has(out.catId) || cur.cats.has(out.catId))) errors.push(`${id}: Kategorie ${JSON.stringify(it.catId)} unbekannt`);
      if (typeof out.url !== 'string' || !/^https?:\/\//i.test(out.url)) errors.push(`${id}: „url“ fehlt oder ist kein http(s)-Link`);
      if (out.state == null){ out.state = 'aktiv'; warnings.push(`${id}: ohne state – wird aktiv`); }
      else if (!STATES.includes(out.state)) errors.push(`${id}: state ${JSON.stringify(out.state)} ungültig`);
      ex ? r.stats.updated++ : r.stats.created++;
      if (out.state === 'aktiv' && (!ex || ex.state !== 'aktiv')) r.stats.activated++;
      if (out.state === 'archiviert') r.stats.archived++;
    } else {
      r.stats.updated++;
      if (ex.state === 'neu') r.stats.activated++;
    }
    r.items.push(out);
  });
  r.stats.cats = r.categories.length; r.stats.items = r.items.length;
  if (!errors.length && !r.items.length && !r.categories.length)
    errors.push('Die Datei enthält nichts Übernehmbares' + (r.stats.unknown ? ` (${r.stats.unknown} unbekannte IDs)` : '') + '.');
  r.ok = errors.length === 0;
  return r;
}

/* Baut die Schreibvorgänge. enrich/preise: nur Anreicherungs-Felder, manuell bearbeitete Felder bleiben unberührt, neu → aktiv. */
function buildOps(v, cur){
  const ops = []; let skippedEdited = 0;
  if (v.kind === 'full'){
    for (const c of v.categories){ const { id, ...data } = c; ops.push({ col:'categories', id, data }); }
    for (const it of v.items){ const { id, ...data } = it; ops.push({ col:'items', id, data }); }
    return { ops, skippedEdited };
  }
  const fields = v.kind === 'preise' ? PRICE_FIELDS : ENRICH_FIELDS.filter(f => f !== 'flags');
  for (const it of v.items){
    const ex = cur.items.get(it.id) || {};
    const ed = isObj(ex.edited) ? ex.edited : {};
    const data = {};
    for (const f of fields){
      if (!(f in it)) continue;
      if (ed[f] === true){ skippedEdited++; continue; }
      data[f] = it[f];
    }
    if (isObj(it.flags)){
      const fl = {};
      for (const [k, val] of Object.entries(it.flags)){
        if (v.kind === 'preise' && !PRICE_FIELDS.includes(k)) continue;
        if (ed[k] === true) continue;
        fl[k] = val;
      }
      if (Object.keys(fl).length) data.flags = fl;
    }
    if (ex.state === 'neu') data.state = 'aktiv';
    if (Object.keys(data).length) ops.push({ col:'items', id:it.id, data });
  }
  return { ops, skippedEdited };
}

const oneLine = s => String(s ?? '').replace(/[\r\n]+/g, ' ').replace(/\|/g, '/').trim();
function buildEnrichText(mode, catMap, itemList){
  const lines = [`/enrich ${mode}`];
  for (const cid of [...new Set(itemList.map(i => i.catId))]){
    const c = catMap.get(cid) || {};
    lines.push(`K ${cid} | ${oneLine(c.room) || '–'} | ${oneLine(c.name) || '–'} | Vorgabe: ${oneLine(c.vorgabe) || '–'}`);
  }
  for (const i of itemList) lines.push(`I ${i.id} | ${i.catId} | ${i.url}`);
  return lines.join('\n');
}
function csvCell(v){
  let s = v == null ? '' : String(v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return /[;"\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
const toCsv = rows => '\uFEFF' + rows.map(r => r.map(csvCell).join(';')).join('\r\n') + '\r\n';
function gapFields(i){
  const fl = isObj(i.flags) ? i.flags : {}, ed = isObj(i.edited) ? i.edited : {};
  return Object.keys(fl).filter(k => GAP_FLAGS.includes(fl[k]) && ed[k] !== true);
}

function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'dataset') Object.assign(el.dataset, v);
    else el.setAttribute(k, v === true ? '' : String(v));
  }
  for (const k of kids.flat(Infinity)){
    if (k == null || k === false) continue;
    el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  }
  return el;
}

/* Schreibt in Batches (≤ 450) und meldet Erfolg erst nach Server-Bestätigung. */
async function commitOps(ops, label, onProgress, prog = { done:0 }){
  const total = ops.length;
  for (let i = 0; i < total; i += BATCH_MAX){
    const chunk = ops.slice(i, i + BATCH_MAX);
    const b = FB.fs.writeBatch(FB.db);
    for (const o of chunk) b.set(docRef(o.col, o.id), o.data, { merge:true });
    onProgress?.(prog.done, total, 'send', i + chunk.length);
    log(`${label}: Batch ${i / BATCH_MAX + 1} (${chunk.length} Dokumente) → commit`);
    const wd = setTimeout(() => {
      onProgress?.(prog.done, total, 'wait', i + chunk.length);
      toast(`${label}: seit 15 s keine Server-Bestätigung – Verbindung prüfen. Der Vorgang läuft weiter.`, 'err');
    }, 15000);
    pending++; updSync();
    try { await b.commit(); }
    finally { clearTimeout(wd); pending--; updSync(); }
    prog.done += chunk.length;
    onProgress?.(prog.done, total, 'ok');
    log(`${label}: Batch vom Server bestätigt (${prog.done}/${total})`);
  }
  return prog.done;
}

const EUR = new Intl.NumberFormat('de-DE', { style:'currency', currency:'EUR' });
function priceNum(p){
  if (typeof p === 'number' && isFinite(p)) return p;
  if (typeof p === 'string'){
    const s = p.replace(/[^\d,.-]/g, '');
    if (!/\d/.test(s)) return null;
    const n = Number(s.includes(',') ? s.replace(/\./g, '').replace(',', '.') : s);
    return isFinite(n) ? n : null;
  }
  return null;
}
const fmtPrice = p => { const n = priceNum(p); return n == null ? null : EUR.format(n); };
function fmtDims(d){
  if (!isObj(d)) return null;
  const parts = [['B', d.w], ['T', d.d], ['H', d.h]].filter(([, v]) => typeof v === 'number').map(([k, v]) => `${k} ${String(v).replace('.', ',')}`);
  return parts.length ? parts.join(' × ') + ' cm' : null;
}
function fmtDate(v){ const ms = toMs(v); return ms ? new Date(ms).toLocaleString('de-DE', { dateStyle:'medium', timeStyle:'short' }) : '–'; }
const ymd = () => { const d = new Date(); return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`; };

const fmtAvail = a => a == null ? null : (AVAIL[String(a).toLowerCase().replace(/^https?:\/\/schema\.org\//, '')] || String(a));
function safeUrl(u){ try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : null; } catch { return null; } }
function hostOf(u){ try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return ''; } }

        inp('pros', 'Pros (eine pro Zeile)', (i.pros || []).join('\n'), { area:true }),
        inp('cons', 'Cons (eine pro Zeile)', (i.cons || []).join('\n'), { area:true })))
  ];
  const txt = v => { const s = v == null ? '' : String(v).trim(); return s || null; };
  const lines = s => { const a = String(s || '').split(/\r?\n/).map(x => x.trim()).filter(Boolean); return a.length ? a : null; };
  const num = (el, label) => { const s = el.value.trim(); if (!s) return null; const n = Number(s.replace(/\s/g, '').replace(',', '.')); if (!isFinite(n)) throw new Error(`${label}: „${s}“ ist keine Zahl`); return n; };
  const save = async () => {
    const upd = {}, edited = {}, fl = {};
    let nv;
    try {
      const w = num(f.dw, 'Breite'), d = num(f.dd, 'Tiefe'), hh = num(f.dh, 'Höhe');
      const nd = w == null && d == null && hh == null ? null : Object.fromEntries([['w', w], ['d', d], ['h', hh]].filter(([, v]) => v != null));
      nv = { price: num(f.price, 'Preis'), dims: nd, images: lines(f.images.value), pros: lines(f.pros.value), cons: lines(f.cons.value) };
      for (const k of EDIT_TEXT) nv[k] = txt(f[k].value);
    } catch (e){ return toast(e.message, 'err'); }
    const old = {
      price: priceNum(i.price),
      dims: isObj(i.dims) && Object.values(i.dims).some(v => v != null) ? Object.fromEntries([['w', i.dims.w], ['d', i.dims.d], ['h', i.dims.h]].filter(([, v]) => v != null)) : null,
      images: lines((i.images || []).join('\n')), pros: lines((i.pros || []).join('\n')), cons: lines((i.cons || []).join('\n'))
    };
    for (const k of EDIT_TEXT) old[k] = txt(i[k]);
    for (const k of Object.keys(nv)) if (JSON.stringify(nv[k]) !== JSON.stringify(old[k])){ upd[k] = nv[k]; edited[k] = true; fl[k] = 'MANUELL'; }
    if (Object.keys(edited).length){ upd.edited = edited; upd.flags = fl; }
    const title = txt(f.title.value); if (title !== txt(i.title)) upd.title = title;
    const note = f.note.value, oldNote = String(i.note ?? '').replace(/\r\n?/g, '\n');
    if (note !== oldNote) upd.note = note.trim() ? note : null;
    if (cat.value && cat.value !== i.catId) upd.catId = cat.value;
    if (Number(prio.value) !== i.prio && !(i.prio == null && prio.value === '2')) upd.prio = Number(prio.value);
    if (!Object.keys(upd).length){ closeDialog(); return toast('Keine Änderungen'); }
    log('Item bearbeiten', id, Object.keys(upd));
    if (await write('Item speichern', () => FB.fs.setDoc(docRef('items', id), upd, { merge:true }))){ closeDialog(); toast('Gespeichert', 'ok'); }
  };
  const setState = async st => { if (await write('Status ändern', () => FB.fs.setDoc(docRef('items', id), { state:st }, { merge:true }))){ closeDialog(); toast(st === 'archiviert' ? 'Archiviert' : 'Wiederhergestellt', 'ok'); } };
  openDialog('Bearbeiten', body, [
    i.state === 'archiviert' ? h('button', { type:'button', class:'btn', onclick: () => setState('aktiv') }, 'Wiederherstellen')
      : i.state === 'aktiv' ? h('button', { type:'button', class:'btn', onclick: () => setState('archiviert') }, 'Archivieren') : null,
    h('button', { type:'button', class:'btn', onclick: closeDialog }, 'Abbrechen'),
    h('button', { type:'button', class:'btn primary', onclick: save }, 'Speichern')]);
}

function startImport(){

async function onImportFile(ev){
  const file = ev.target.files && ev.target.files[0];
  if (!file) return abortImp('Keine Datei gewählt.');
  log('Import 2/7: Datei gewählt', { name:file.name, size:file.size });
  impBusy = true; scheduleRender(); setImpProg('Lese Datei …');
  impNote(`Datei gewählt: ${file.name} (${Math.round(file.size / 1024)} KB)`);
  if (file.size > 10e6) return abortImp(`Datei zu groß (${(file.size / 1e6).toFixed(1)} MB)`);
  let text;
  try { text = await file.text(); } catch (e){ return abortImp(`Datei nicht lesbar (${e.name})`, e); }
  finally { ev.target.value = ''; }
  log('Import 3/7: eingelesen', text.length, 'Zeichen');
  let data;
  try { data = JSON.parse(text.replace(/^\uFEFF/, '')); } catch (e){ return abortImp(`Kein gültiges JSON: ${e.message}`, e); }
  if (!S.loaded.items || !S.loaded.categories) return abortImp('Katalog noch nicht geladen – in ein paar Sekunden erneut versuchen (Verbindung prüfen).');
  const cur = { cats: S.categories, items: S.items };
  let v;
  try { v = validateImport(data, cur); } catch (e){ return abortImp(`Prüfung fehlgeschlagen: ${e.message}`, e); }
  log('Import 4/7: Prüfung', { gültig:v.ok, kind:v.kind, fehler:v.errors.length, hinweise:v.warnings.length, stats:v.stats });
  if (!v.ok){
    openDialog('Import nicht möglich', [h('p', null, `${v.errors.length} Fehler in ${file.name}:`),
      h('ul', null, v.errors.slice(0, 25).map(e => h('li', null, e))), v.errors.length > 25 ? h('p', { class:'muted' }, `… und ${v.errors.length - 25} weitere (Konsole)`) : null],
      [h('button', { type:'button', class:'btn', onclick: closeDialog }, 'Schließen')]);
    console.error('[CozyNest] Importfehler', v.errors);
    return abortImp(`${v.errors.length} Fehler in der Datei – Details im Dialog`);
  }
  const plan = buildOps(v, cur);
  const nCat = plan.ops.filter(o => o.col === 'categories').length, nItem = plan.ops.length - nCat;
  log('Import 5/7: Vorschau', { schreibvorgänge:plan.ops.length, kategorien:nCat, items:nItem, übersprungen_manuell:plan.skippedEdited });
  setImpProg('Warte auf Bestätigung …');
  const s = v.stats;
  const rows = [
    ['Typ', v.kind === 'full' ? 'Vollständiger Katalog' : v.kind === 'preise' ? 'Preis-Aktualisierung' : 'Anreicherung'],
    ['Ergebnis', `${s.activated} aktiviert · ${s.updated} aktualisiert · ${s.unknown} unbekannte IDs`],
    v.kind === 'full' ? ['Kategorien', `${s.catsNew} neu · ${s.catsUpdated} aktualisiert`] : null,
    v.kind === 'full' ? ['Items', `${s.created} neu · ${s.updated} aktualisiert · davon ${s.archived} archiviert`] : null,
    plan.skippedEdited ? ['Manuell bearbeitet, bleibt', `${plan.skippedEdited} Felder`] : null,
    ['Schreibvorgänge', String(plan.ops.length)]
  ].filter(Boolean);
  const body = [h('p', null, file.name), h('table', { class:'t' }, rows.map(([a, b]) => h('tr', null, h('td', null, a), h('td', null, b)))),
    s.unknown ? h('p', { class:'hint' }, `Unbekannte IDs werden übersprungen: ${v.unknownIds.slice(0, 10).join(', ')}${s.unknown > 10 ? ' …' : ''}`) : null,
    v.warnings.length ? h('details', { class:'more' }, h('summary', null, `${v.warnings.length} Hinweise`), h('ul', null, v.warnings.slice(0, 40).map(w => h('li', null, w)))) : null];
  const ok = await ask('Import prüfen', body, 'Bestätigen', 'Abbrechen',
    v.kind === 'full' ? { gate:'Vollimport bestätigen: überschreibt Notizen, Prio, Status und Kategorien der enthaltenen Einträge' } : {});
  if (!ok){ log('Import: vom Nutzer abgebrochen'); impBusy = false; setImpProg(''); impNote('Abgebrochen (Dialog)'); toast('Import abgebrochen'); scheduleRender(); return; }
  if (!isResearcher()) return abortImp('Keine Berechtigung – bitte mit dem Researcher-Konto anmelden');
  if (!plan.ops.length) return abortImp('Nichts zu schreiben.');
  log('Import 6/7: schreibe', plan.ops.length, 'Dokumente nach', `shortlists/${CONFIG.listId}/`);
  impNote(`Schreibe ${plan.ops.length} Dokumente …`);
  const prog = { done:0 };
  try {
    await commitOps(plan.ops, 'Import', (d, t, phase, upto) =>
      setImpProg(phase === 'wait' ? `Schreibe ${upto}/${t} … warte auf Server-Bestätigung` : phase === 'send' ? `Schreibe ${upto}/${t} …` : `${d}/${t} bestätigt`), prog);
  } catch (e){
    const code = e?.code || e?.name || 'unbekannt';
    return abortImp(`${errText(code)} (${code}) – ${prog.done}/${plan.ops.length} geschrieben`, e);
  }
  const msg = `${nCat} Kategorien, ${nItem} Items geschrieben`;
  log('Import 7/7: fertig –', msg);
  impBusy = false; setImpProg('Fertig: ' + msg);
  impNote('Erfolg (vom Server bestätigt): ' + msg, 'ok');
  toast('Import erfolgreich: ' + msg, 'ok');
  scheduleRender();
}

/* ---------- Rahmen: Rendering, Sync, Migration ---------- */
let rq = 0;
function scheduleRender(){ if (!rq) rq = requestAnimationFrame(render); }
function render(){
  rq = 0;
  const m = mode();
  const ae = document.activeElement, fk = ae?.dataset?.fk;
  const sel = ae && typeof ae.selectionStart === 'number' ? [ae.selectionStart, ae.selectionEnd] : null;
  const root = $('#app'), box = h('div');
  try { ({ order: renderOrder, edit: renderEdit, add: renderAdd, decide: renderDecide })[m](box); }
  catch (e){ console.error('[CozyNest] Anzeige', e); box.append(h('div', { class:'notice' }, 'Anzeige-Fehler: ' + e.message)); toast('Anzeige-Fehler: ' + e.message, 'err'); }
  root.replaceChildren(...box.childNodes);
  if (ae && ae !== document.body && document.activeElement !== ae){
    const t = ae.isConnected ? ae : (fk ? root.querySelector(`[data-fk="${CSS.escape(fk)}"]`) : null);
    if (t){ t.focus({ preventScroll:true }); if (sel && t.setSelectionRange) try { t.setSelectionRange(sel[0], sel[1]); } catch {} }
  }
  root.querySelectorAll('textarea.cmt').forEach(grow);
  renderChrome(m); maybeMigrate();
}

  else if (!navigator.onLine) n.append(h('div', { class:'notice', role:'status' }, 'Offline – angezeigt wird der zuletzt gespeicherte Stand. Änderungen werden nachgeholt.'));

function updSync(){

    : !navigator.onLine ? 'offline – Änderungen werden nachgeholt'

let migrated = false;
async function maybeMigrate(){
  if (migrated || mode() !== 'decide' || !FB || !S.decServer || !S.loaded.categories || !S.loaded.items) return;
  let raw = null; try { raw = localStorage.getItem('shortlist-state'); } catch {}
  migrated = true;
  if (!raw) return;
  let old; try { old = JSON.parse(raw); } catch (e){ return fail('Alte Bewertungen lesen', e); }
  const src = isObj(old?.decisions) ? old.decisions : old, ops = [];
  const strs = a => Array.isArray(a) ? a.filter(x => typeof x === 'string') : [];
  for (const [catId, d] of Object.entries(isObj(src) ? src : {})){
    if (!S.categories.has(catId) || !isObj(d)) continue;
    const ex = S.decisions.get(catId);
    if (ex && (ex.fav || ex.ok?.length || ex.no?.length || Object.keys(ex.c || {}).length || ex.cc)) continue;
    const c = isObj(d.c) ? Object.fromEntries(Object.entries(d.c).filter(([, v]) => typeof v === 'string')) : {};
    ops.push({ col:'decisions', id:catId, data:{ fav: typeof d.fav === 'string' ? d.fav : null, ok:strs(d.ok), no:strs(d.no), c, cc: typeof d.cc === 'string' ? d.cc : '', updatedAt: FB.fs.serverTimestamp() } });
  }
  try {
    if (ops.length){ await commitOps(ops, 'Migration'); toast(`Frühere Bewertungen übernommen (${ops.length} Kategorien)`, 'ok'); }
    localStorage.removeItem('shortlist-state');
  } catch (e){ fail('Frühere Bewertungen übernehmen', e); }
}

/* ---------- Firebase ---------- */
async function initFirebase(){
  let app, au, fs;
  try { [app, au, fs] = await Promise.all([import(SDK + 'firebase-app.js'), import(SDK + 'firebase-auth.js'), import(SDK + 'firebase-firestore.js')]); }
  catch (e){ S.fbErr = e; console.error('[CozyNest] Firebase SDK nicht ladbar', e); toast('Datenbank nicht erreichbar – Firebase konnte nicht geladen werden', 'err'); scheduleRender(); return; }
  try {
    const fapp = app.initializeApp(CONFIG.firebaseConfig);
    let db;
    try { db = fs.initializeFirestore(fapp, { ignoreUndefinedProperties:true, localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) }); }
    catch (e){ console.error('[CozyNest] Offline-Cache', e); db = fs.initializeFirestore(fapp, { ignoreUndefinedProperties:true, localCache: fs.memoryLocalCache() }); toast('Offline-Speicher nicht verfügbar – Änderungen nur online', 'err'); }
    const auth = au.getAuth(fapp);
    FB = { db, auth, fs, au };
    try { await au.setPersistence(auth, au.browserLocalPersistence); } catch (e){ fail('Anmeldung merken', e); }
    au.onAuthStateChanged(auth, onAuth, e => fail('Anmeldestatus', e));
    log('Firebase', SDK_VERSION, 'initialisiert · Pfad', `shortlists/${CONFIG.listId}/`);
  } catch (e){ S.fbErr = e; fail('Firebase-Start', e); scheduleRender(); }
}
async function onAuth(user){
  S.user = user;
  log('Anmeldung:', user ? (user.isAnonymous ? 'anonym' : `Google (${user.email})`) : 'keine');
  if (!user){
    try { await FB.au.signInAnonymously(FB.auth); }
    catch (e){ S.fbErr = e; fail('Anonyme Anmeldung', e); scheduleRender(); }
    return;
  }
  S.fbErr = null;
  startListeners(); scheduleRender();
}
function startListeners(){
  for (const c of COLS){
    if (unsubs[c]) continue;
    unsubs[c] = FB.fs.onSnapshot(colRef(c), { includeMetadataChanges:true }, snap => {
      const m = new Map();
      snap.forEach(d => m.set(d.id, d.data({ serverTimestamps:'estimate' })));
      const first = !S.loaded[c];
      S[c] = m; S.loaded[c] = true; S.pendingSnap[c] = snap.metadata.hasPendingWrites;
      if (c === 'decisions' && !snap.metadata.fromCache) S.decServer = true;
      if (first) log(`Geladen: ${c} (${m.size})`, snap.metadata.fromCache ? 'aus Cache' : 'vom Server');
      scheduleRender();
    }, e => { unsubs[c] = null; fail(`Daten laden (${c})`, e); scheduleRender(); });
  }
}

/* ---------- Start ---------- */
$('#impFile').addEventListener('change', ev => { onImportFile(ev).catch(e => abortImp(`Unerwarteter Fehler: ${e.message}`, e)); });
window.addEventListener('hashchange', () => { closeDialog(); window.scrollTo(0, 0); render(); });
window.addEventListener('online', () => renderChrome(mode()));
window.addEventListener('offline', () => renderChrome(mode()));
window.addEventListener('pagehide', () => {
  flushComments();
  if (mode() !== 'decide' || !S.loaded.items) return;
  try {
    localStorage.setItem('cozynest-lastVisit', String(Date.now()));
    localStorage.setItem('cozynest-seen', JSON.stringify(allItems().filter(i => i.state === 'aktiv').map(i => i.id)));
  } catch {}
});
window.addEventListener('unhandledrejection', e => { console.error('[CozyNest] Unbehandelter Fehler', e.reason); toast('Unerwarteter Fehler: ' + (e.reason?.message || e.reason), 'err'); });
log('Start', { sdk:SDK_VERSION, listId:CONFIG.listId, modus:mode() });
render();
initFirebase();
</script>
