<style>

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:400 16px/1.5 "Nunito Sans",system-ui,sans-serif;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.2;margin:0}
a{color:var(--accent)}
button,textarea,input{font:inherit;color:inherit}

.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{padding:calc(20px + env(safe-area-inset-top,0px)) 0 16px;background:var(--bg)}
header.top h1{font-size:2rem;letter-spacing:-.01em}
header.top p{margin:2px 0 14px;color:var(--muted)}
.progress{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:8px;background:var(--border);border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s}
.progress small{color:var(--muted);white-space:nowrap}
.room{margin:28px 0 8px}
.room h2{font-size:1.4rem;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:720px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{display:block;width:100%;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:0;cursor:pointer;overflow:hidden}
.tile .tb{padding:14px 16px 16px}
.tile h3{font-size:1.2rem;margin-bottom:4px}
.tile .meta{color:var(--muted);font-size:.92rem}
.tile .st{display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:700}
.tile .st.done{color:var(--accent)}
.tile .st.ordered{color:var(--sage)}
.tile .st.open{color:var(--muted);font-weight:600}
.mini{width:36px;height:36px;border-radius:8px;background:#fff;object-fit:contain;padding:2px;border:1px solid var(--border)}
.imgbox{position:relative;aspect-ratio:4/3;background:#FFFFFF;padding:8px;border-radius:var(--r) var(--r) 0 0;overflow:hidden}
.imgbox img{display:block;width:100%;height:100%;object-fit:contain}
.imgfallback{display:flex;align-items:center;justify-content:center;width:100%;height:100%;color:var(--muted);font-size:.8rem;text-decoration:none}
.badge{position:absolute;top:10px;padding:4px 10px;border-radius:99px;font-size:.8rem;font-weight:700;color:#fff;background:var(--sage)}
.badge.rec{left:10px}.badge.ord{right:10px}
.back{display:inline-flex;align-items:center;min-height:44px;color:var(--muted);text-decoration:none;font-weight:600}
.cathead h2{font-size:1.8rem}

.chip{display:inline-block;margin:10px 0 0;padding:6px 12px;border-radius:99px;background:var(--accent-soft);font-size:.9rem;font-weight:600}
.recline{margin:10px 0 0;color:var(--sage);font-weight:600}
.cards{margin-top:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;transition:opacity .2s}
.card.is-no{opacity:.55}
.card.is-fav{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}

.warn{color:var(--accent);font-size:.88rem;font-weight:600}

.catcomment h3{font-size:1.1rem;margin-bottom:8px}

.editfield label{display:block;font-size:.85rem;font-weight:700;color:var(--muted);margin-bottom:4px}

        renderOrder();
        return;
      }
      if (inc && inc.ts >= state.ts) { state = inc; lsSet(LS_STATE, state); }
      if (P.s) history.replaceState(null, '', location.pathname + location.search + hashFor(P.c && CAT_BY_ID[P.c] ? P.c : null));
      var btn = document.getElementById('sendbtn');
      if (MODE === 'edit') { btn.textContent = 'Änderungen exportieren'; btn.addEventListener('click', exportEdits); }
      else btn.addEventListener('click', onSend);
      document.getElementById('sendbar').hidden = false;
      window.addEventListener('hashchange', route);
      route();
    });
  }
  init();
})();

</script>
</body>
</html>
