<style>
:root{--bg:#F8F4EC;--surface:#FFFDF8;--sand:#EFE7DA;--beige:#E3D8C6;--border:#E8E0D2;--text:#3A3835;--muted:#8A857D;--sage:#8FA088;--sage-soft:#E3EADF;--rose:#B98589;--rose-soft:#F2E1DE;--note-bg:#F3EDE2;--img-bg:#FFFFFF;--shadow:0 2px 14px rgba(40,38,35,.06);--r:16px;--serif:"Fraunces",Georgia,serif;--sans:"Nunito Sans",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#1E1D1B;--surface:#292826;--sand:#34322F;--beige:#403D39;--border:#3D3B37;--text:#F1ECE4;--muted:#A8A298;--sage:#A7B7A0;--sage-soft:#2F3A2D;--rose:#D7A9AC;--rose-soft:#3E2F30;--note-bg:#2F2D2A}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--sans);padding-top:env(safe-area-inset-top,0px)}
body.hasbar{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;line-height:1.2}
.muted{color:var(--muted)}.small{font-size:13px}
.hint{font-size:12px;color:var(--muted)}
.warn{font-size:13px;color:var(--rose)}
header.top{padding:24px 0 8px}
header.top h1{font-size:32px;letter-spacing:-.01em}
.sub{margin:2px 0 14px;color:var(--muted)}
.prog{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:4px;background:var(--sand);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--sage);transition:width .3s}
#progt{font-size:13px;color:var(--muted);white-space:nowrap}
.room h2{font-size:22px;margin:28px 0 12px}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:720px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile,.card,.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.tile,.card{display:flex;flex-direction:column;overflow:hidden}
.tile{cursor:pointer;transition:border-color .15s}
.tile:hover{border-color:var(--beige)}
.tbody{padding:12px 16px 16px;display:flex;flex-direction:column;gap:4px}
.tname{font-family:var(--serif);font-weight:500;font-size:20px}
.tstat{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;font-size:14px}
.tstat.open{font-weight:600;color:var(--muted)}
.mini{display:inline-flex;align-items:center;gap:6px;font-weight:400;color:var(--muted);min-width:0}
.mini-t{max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.counts{font-size:13px;color:var(--muted)}
.imgbox{position:relative;aspect-ratio:4/3;background:var(--img-bg);padding:8px;width:100%}
.imgbox img{display:block;width:100%;height:100%;object-fit:contain}
.imgbox.mini-img{width:40px;height:30px;aspect-ratio:auto;padding:2px;border-radius:6px;border:1px solid var(--border);flex:none}
.imgbox.thumb{width:88px;padding:4px;border-radius:10px;border:1px solid var(--border);flex:none}
.fb{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:12px;color:var(--muted);text-decoration:none}
.badge{position:absolute;top:10px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--sage-soft);color:var(--text);border:1px solid var(--sage)}
.badge.rec{left:10px}.badge.ord{right:10px}
.card.dim{opacity:.55}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.ptitle{font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.desc{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{font-size:22px;font-weight:700;line-height:1.2}
.dims{font-size:14px}
.note{background:var(--note-bg);border-left:4px solid var(--sage);border-radius:10px;padding:10px 12px}
.note b{display:block;font-size:13px}
.note p{margin:4px 0 0;white-space:pre-line}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}
.sb{min-height:44px;border-radius:12px;background:var(--sand);border:1px solid var(--border);color:var(--text);font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:0 4px}
.sb:hover{background:var(--beige)}
.sb .ic{color:var(--muted)}
.sb.fav[aria-pressed="true"]{background:var(--rose-soft);border-color:var(--rose)}
.sb.fav[aria-pressed="true"] .ic{color:var(--rose)}
.sb.ok[aria-pressed="true"]{background:var(--sage-soft);border-color:var(--sage)}
.sb.ok[aria-pressed="true"] .ic{color:var(--sage)}
.sb.no[aria-pressed="true"]{background:var(--sand);border-color:var(--muted)}
.plink{align-self:flex-start;min-height:44px;display:inline-flex;align-items:center;color:var(--text);font-weight:600}
.cwrap{display:flex;flex-direction:column;gap:2px}
textarea.cmt,textarea.edit{width:100%;min-height:44px;resize:none;overflow:hidden;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);font:inherit;font-size:15px;padding:10px 12px}
textarea.edit{background:var(--surface);white-space:pre-wrap}
textarea.cmt:focus,textarea.edit:focus{outline:none;border-color:var(--beige);box-shadow:0 0 0 2px var(--beige)}
.saved{font-size:12px;color:var(--sage);opacity:0;transition:opacity .2s;min-height:18px}
.saved.on{opacity:1}
details{border-top:1px solid var(--border);margin-top:4px}
summary{min-height:44px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-weight:700;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--muted);font-size:20px}
details[open] summary::after{content:"–"}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.thumbs .imgbox{padding:4px;border-radius:10px;border:1px solid var(--border)}

dl.facts dt{color:var(--muted)}dl.facts dd{margin:0}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:14px}
.pc h4{margin:0 0 4px;font-size:13px;color:var(--muted);font-weight:700}
.pc ul{margin:0;padding-left:16px}
.cathead{padding:4px 0 16px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.back{background:none;border:0;color:var(--text);font:inherit;font-weight:600;min-height:44px;padding:0;cursor:pointer}
.cattitle{font-size:28px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--rose-soft);border:1px solid var(--rose);border-radius:99px;padding:3px 12px;font-size:13px}

.catc{margin:24px 0 8px;max-width:720px}
.catc label,.elabel{display:block;font-weight:700;margin-bottom:6px}
.btn{min-height:44px;padding:0 18px;border-radius:12px;background:var(--sand);color:var(--text);border:1px solid var(--border);font:inherit;font-weight:700;cursor:pointer}
.btn:hover{background:var(--beige)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--text);color:var(--surface);border-color:var(--text)}
.btn.primary:hover{background:var(--text);opacity:.92}
.sendbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--border);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.barin{max-width:560px;margin:0 auto;display:flex;gap:8px}
.barin .btn{flex:1;min-height:50px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);background:var(--text);color:var(--surface);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;max-width:calc(100% - 32px);text-align:center}

.toast.on{opacity:1;transform:translate(-50%,0)}
.scrim{position:fixed;inset:0;background:var(--text);opacity:.35;z-index:50}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:560px;margin:0 auto;background:var(--surface);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}

.openlist{margin:0 0 16px;padding-left:18px;color:var(--muted)}
.sheet-actions{display:flex;flex-direction:column;gap:8px}
.panel{padding:16px;margin:16px 0}

.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.shophead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.shopsum{font-weight:700;white-space:nowrap}
.orow{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
.oinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.oname{font-weight:700;color:var(--text)}
.oside{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
.oprice{font-weight:700;white-space:nowrap}
.art{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px}
.art code{background:var(--sand);padding:2px 6px;border-radius:6px;font-size:13px}
.mini-btn{min-height:44px;padding:0 12px;border-radius:10px;background:var(--sand);border:1px solid var(--border);color:var(--text);font:inherit;font-size:13px;font-weight:600;cursor:pointer}

.foot{padding:32px 16px 24px;font-size:12px;color:var(--muted)}
.offscreen{position:fixed;left:-9999px;top:0;opacity:0}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

  copyText(JSON.stringify(out, null, 1), n + (n === 1 ? ' Änderung' : ' Änderungen') + ' kopiert – im Projekt-Chat mit /curate einfügen');
}

/* ---------- Modus 2: Umsetzer ---------- */
function renderOrder() {
  const app = $('app');
  const S = orderState || state;
  const loc = loadLS(K_ORD, {}) || {};
  let dirty = false;
  for (const id of Object.keys(loc)) { const it = byId.get(id); if (!it || it.status === 'bestellt') { delete loc[id]; dirty = true; } }
  if (dirty) saveLS(K_ORD, loc);
  const rows = [];
  activeCats.forEach(c => { const s = S.sel[c.id]; if (s && s.fav && byId.has(s.fav)) rows.push({ c, it: byId.get(s.fav), cm: s.c[s.fav] || '', cc: s.cc || '' }); });
  const done = r => r.it.status === 'bestellt' || !!loc[r.it.id];
  const sum = l => l.reduce((a, r) => a + (price(r.it) || 0), 0);
  const fmtSum = l => EUR.format(sum(l)) + (l.some(r => price(r.it) == null) ? ' + offene Preise' : '');
  const newIds = rows.filter(r => r.it.status !== 'bestellt' && loc[r.it.id]).map(r => r.it.id);
  const doneRows = rows.filter(done);
  const kpi = (lab, val) => h('div', { class: 'kpi' }, h('b', { text: val }), h('span', { text: lab }));
  const nodes = [];
  nodes.push(h('section', { class: 'panel' },
    h('h2', { text: 'Favoriten zum Bestellen' }),
    h('div', { class: 'kpis' }, kpi('Favoriten', String(rows.length)), kpi('Summe gesamt', fmtSum(rows)), kpi('davon bestellt (' + doneRows.length + '/' + rows.length + ')', EUR.format(sum(doneRows)))),
    h('div', { class: 'actions' },
      h('button', { type: 'button', class: 'btn primary', disabled: !newIds.length, onclick: () => copyText('/bestellt ' + newIds.join(' '), 'Kopiert – im Projekt-Chat einfügen') },
        'Bestellstatus übernehmen' + (newIds.length ? ' (' + newIds.length + ')' : '')),
      h('button', { type: 'button', class: 'btn', disabled: !rows.length, onclick: () => exportCsv(rows, loc) }, 'CSV exportieren')),
    orderState ? null : h('p', { class: 'hint', text: 'Kein Auswahl-Link geöffnet. Angezeigt wird die Auswahl auf diesem Gerät.' })));
  if (!rows.length) nodes.push(h('p', { class: 'muted', text: 'Noch keine Favoriten ausgewählt.' }));
  const shops = new Map();
  rows.forEach(r => { const k = r.it.shop || shopName(r.it); if (!shops.has(k)) shops.set(k, []); shops.get(k).push(r); });
  shops.forEach(list => {
    const todo = list.filter(r => !done(r));
    nodes.push(h('section', { class: 'panel' },
      h('div', { class: 'shophead' }, h('h2', { text: shopName(list[0].it) }), h('span', { class: 'shopsum', text: fmtSum(list) })),
      h('div', { class: 'actions' },
        h('button', { type: 'button', class: 'btn', disabled: !todo.length, onclick: () => todo.forEach(r => { const u = safeUrl(r.it.url); if (u) window.open(u, '_blank', 'noopener'); }) },
          'Alle Links dieses Shops öffnen (' + todo.length + ')'),
        h('span', { class: 'hint', text: 'Blockiert der Browser Pop-ups, einmalig für diese Seite erlauben.' })),
      h('div', null, list.map(r => orderRow(r, loc)))));
  });
  const open = activeCats.filter(c => !(S.sel[c.id] && S.sel[c.id].fav));
  if (open.length) {
    nodes.push(h('section', { class: 'panel' }, h('h2', { text: 'Offen' }),
      open.map(c => {
        const s = S.sel[c.id] || { ok: [], c: {}, cc: '' };
        const oks = s.ok.map(id => byId.get(id)).filter(Boolean);
        return h('div', { class: 'openblk' },
          h('h3', { text: c.raum + ': ' + c.kategorie }),
          oks.length ? h('ul', { class: 'altlist' }, oks.map(it => h('li', null, linkEl(it, title(it), 'oname'), ' – ' + fmtPrice(it), s.c[it.id] ? h('div', { class: 'quote', text: s.c[it.id] }) : null)))
            : h('p', { class: 'small muted', text: 'Keine „Auch ok“-Alternativen.' }),
          s.cc ? h('div', { class: 'quote', text: 'Zur Kategorie: ' + s.cc }) : null);
      })));
  }
  app.replaceChildren(...nodes);
}
function orderRow(r, loc) {
  const it = r.it, art = artNr(it), isData = it.status === 'bestellt', checked = isData || !!loc[it.id];
  const cb = h('input', { type: 'checkbox', checked, disabled: isData, 'aria-label': 'bestellt: ' + title(it) });
  cb.addEventListener('change', () => { const L = loadLS(K_ORD, {}) || {}; if (cb.checked) L[it.id] = todayISO(); else delete L[it.id]; saveLS(K_ORD, L); render(); });
  const lab = isData ? (ddmm(it.bestellt_am) ? 'bestellt am ' + ddmm(it.bestellt_am) : 'bestellt') : 'bestellt';
  return h('div', { class: 'orow' + (checked ? ' isdone' : '') },
    imgBox(it, { link: true, cls: 'thumb' }),
    h('div', { class: 'oinfo' },
      h('div', { class: 'small muted', text: r.c.raum + ': ' + r.c.kategorie }),
      linkEl(it, title(it), 'oname'),
      art ? h('div', { class: 'art' }, h('span', { text: 'Art.-Nr.' }), h('code', { text: art }),
        h('button', { type: 'button', class: 'mini-btn', 'aria-label': 'Artikelnummer ' + art + ' kopieren', onclick: () => copyText(art, 'Artikelnummer kopiert') }, 'Kopieren'))
        : h('div', { class: 'small muted', text: 'Art.-Nr. im Shop prüfen' }),
      r.cm ? h('div', { class: 'quote', text: r.cm }) : null,
      r.cc ? h('div', { class: 'quote', text: 'Zur Kategorie: ' + r.cc }) : null),
    h('div', { class: 'oside' }, h('div', { class: 'oprice', text: fmtPrice(it) }), h('label', { class: 'chk' }, cb, h('span', { text: lab }))));
}
function exportCsv(rows, loc) {
  const cell = v => { v = v == null ? '' : String(v); return /[;"\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const lines = ['ID;Raum;Kategorie;Produkt;Shop;Artikelnr;Preis;Link;Kommentar_Partnerin;Status;Bestellt_am'];
  rows.forEach(r => {
    const it = r.it, p = price(it), isData = it.status === 'bestellt', isLoc = !!loc[it.id];
    lines.push([it.id, r.c.raum, r.c.kategorie, title(it), shopName(it), artNr(it), p != null ? p.toFixed(2).replace('.', ',') : '', it.url, r.cm,
      (isData || isLoc) ? 'bestellt' : 'offen', isData ? (it.bestellt_am || '') : (isLoc ? loc[it.id] : '')].map(cell).join(';'));
  });
  const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = h('a', { href: URL.createObjectURL(blob), download: 'bestellliste.csv', class: 'offscreen' });
  document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('bestellliste.csv exportiert');
}

/* ---------- Start ---------- */
async function init() {
  const s = HP.get('s');
  if (s) {
    try {
      const imp = normalize(await decodeState(s));
      if (MODE === 'order') orderState = imp;
      else {
        if (!state.ts || imp.ts >= state.ts) { state = imp; saveLS(K_STATE, state); }
        history.replaceState(history.state, '', location.pathname + location.search + (MODE === 'edit' ? '#mode=edit' : ''));
      }
    } catch (_) { toast('Auswahl-Link unvollständig – bitte komplett kopieren'); }
  }
  render();
  buildLink();
}
render();
init();
})();
</script>
