<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Möbel-Shortlist</title>
<style>
:root{
  --bg:#f5f5f4; --card:#ffffff; --text:#1c1c1c; --muted:#6b6b6b; --border:#e0e0de;
  --accent:#b5451b; --accent-bg:#fbeee7; --ok:#2f7d4f; --no:#a33a3a; --fav:#c98a1c;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#181816; --card:#242422; --text:#f0efec; --muted:#a3a19c; --border:#38372f;
    --accent:#e2793f; --accent-bg:#3a2a1f; --ok:#4caf7d; --no:#e05c5c; --fav:#e0b03e; }
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-tap-highlight-color:transparent;
}
#app{max-width:640px;margin:0 auto;padding:12px 12px 90px;}
h1{font-size:1.3rem;margin:8px 0 4px;}
h2{font-size:1.1rem;margin:16px 0 8px;}
h3{font-size:1rem;margin:0 0 4px;}
a{color:var(--accent);}
.topbar{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);background:var(--bg);
  z-index:20;padding-bottom:6px;border-bottom:1px solid var(--border);margin-bottom:8px;
  display:flex;align-items:center;gap:8px;}
.topbar button.back{min-width:44px;min-height:44px;background:none;border:none;font-size:1.3rem;color:var(--text);cursor:pointer;}
.topbar .title{flex:1;font-weight:600;}
.room-group{margin-bottom:18px;}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.tile{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;cursor:pointer;min-height:88px;display:flex;flex-direction:column;justify-content:space-between;}
.tile .kat{font-weight:600;}
.tile .progress{font-size:.85rem;color:var(--muted);margin-top:8px;}
.progress-bar{height:5px;border-radius:3px;background:var(--border);margin-top:4px;overflow:hidden;}
.progress-bar > div{height:100%;background:var(--ok);}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.filters select, .filters input[type=number]{
  padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);
  min-height:40px;font-size:.9rem;
}
.filters label.chk{display:flex;align-items:center;gap:4px;font-size:.85rem;min-height:40px;}
.sortbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:.85rem;}
.sortbar select{padding:6px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);min-height:40px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  margin-bottom:12px;overflow:hidden;}
.card .imgwrap{width:100%;aspect-ratio:4/3;background:var(--border);position:relative;cursor:pointer;}
.card img{width:100%;height:100%;object-fit:cover;display:block;}
.imgfallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:.85rem;color:var(--muted);text-align:center;padding:8px;gap:4px;}
.card .body{padding:10px 12px 12px;}
.badge{display:inline-block;font-size:.72rem;padding:2px 7px;border-radius:20px;margin-right:4px;margin-bottom:4px;}
.badge.rec{background:var(--fav);color:#231a00;}
.badge.vorgabe-ok{background:#dff3e5;color:var(--ok);}
.badge.vorgabe-bad{background:#fbe1e1;color:var(--no);}
.price{font-weight:700;font-size:1.05rem;}
.meta{color:var(--muted);font-size:.85rem;margin:2px 0;}
.notiz{background:var(--accent-bg);border-radius:8px;padding:8px 10px;font-size:.85rem;margin-top:6px;}
.decision-row{display:flex;gap:8px;margin-top:10px;}
.decision-row button{flex:1;min-height:44px;border-radius:8px;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-size:1rem;cursor:pointer;}
.decision-row button.active.fav{background:var(--fav);color:#231a00;border-color:var(--fav);}
.decision-row button.active.ok{background:var(--ok);color:#fff;border-color:var(--ok);}
.decision-row button.active.no{background:var(--no);color:#fff;border-color:var(--no);}
.compare-check{position:absolute;top:8px;left:8px;width:26px;height:26px;z-index:5;}
.card{position:relative;}
textarea.comment{width:100%;margin-top:8px;border-radius:8px;border:1px solid var(--border);
  background:var(--card);color:var(--text);padding:8px;font-size:.85rem;min-height:40px;font-family:inherit;}
.cat-comment{margin:8px 0 14px;}
.compare-bar{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--border);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:20;
  margin:0 -12px;}
.btn{min-height:44px;border-radius:8px;border:1px solid var(--border);background:var(--card);
  color:var(--text);padding:0 14px;font-size:.95rem;cursor:pointer;}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;
  align-items:flex-end;justify-content:center;}
.modal{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;
  border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));}
.gallery{display:flex;overflow-x:auto;gap:8px;scroll-snap-type:x mandatory;margin-bottom:10px;}
.gallery img{width:85%;flex:0 0 auto;aspect-ratio:4/3;object-fit:cover;border-radius:8px;scroll-snap-align:start;}
.field-table{width:100%;border-collapse:collapse;font-size:.85rem;margin:10px 0;}
.field-table td{padding:5px 4px;border-bottom:1px solid var(--border);}
.field-table td:first-child{color:var(--muted);width:40%;}
.proscons{display:grid;grid-template-columns:1fr;gap:10px;margin:10px 0;}
.proscons .pros li{color:var(--ok);} .proscons .cons li{color:var(--no);}
.proscons ul{margin:4px 0;padding-left:18px;}
table.compare{width:100%;border-collapse:collapse;font-size:.82rem;margin-bottom:14px;}
table.compare th, table.compare td{border:1px solid var(--border);padding:6px;text-align:left;}
table.compare td.best{background:var(--accent-bg);font-weight:700;}
table.compare th img{width:60px;height:45px;object-fit:cover;border-radius:4px;}
.shop-group{margin-bottom:20px;}
.shop-group h3{display:flex;justify-content:space-between;}
.order-row{display:flex;gap:10px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:10px;margin-bottom:8px;align-items:flex-start;}
.order-row img{width:64px;height:64px;object-fit:cover;border-radius:6px;flex:0 0 auto;}
.order-row .info{flex:1;min-width:0;}
.order-row .artnr{display:flex;gap:6px;align-items:center;font-size:.8rem;color:var(--muted);}
.order-row .artnr button{border:none;background:none;color:var(--accent);cursor:pointer;font-size:.8rem;padding:4px;}
.order-row .comment{font-size:.82rem;font-style:italic;color:var(--muted);margin-top:4px;}
.order-row input[type=checkbox]{width:24px;height:24px;margin-top:4px;}
.sumline{display:flex;justify-content:space-between;font-weight:600;margin:6px 0 4px;font-size:.9rem;}
.totalline{font-size:1.05rem;font-weight:700;margin-top:10px;border-top:2px solid var(--border);padding-top:8px;}
.open-cat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-bottom:10px;}
.editfield{width:100%;border:1px dashed var(--accent);background:var(--card);color:var(--text);
  border-radius:6px;padding:6px;font-size:.85rem;font-family:inherit;margin-top:4px;}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
  background:var(--text);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:.85rem;z-index:100;}
.hint{font-size:.75rem;color:var(--muted);margin-top:4px;}
.recomm{background:var(--accent-bg);border-radius:8px;padding:8px 10px;font-size:.85rem;margin-bottom:10px;}
</style>
</head>

<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById('app-data').textContent);
var STORAGE_KEY = 'shortlist-state';
var BESTELLT_KEY = 'shortlist-bestellt';
var itemsById = {}; DATA.items.forEach(function(it){ itemsById[it.id]=it; });
var catsById = {}; DATA.kategorien.forEach(function(c){ catsById[c.id]=c; });

function b64urlEncode(bytes){
  var bin=''; for (var i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64urlDecode(str){
  str=str.replace(/-/g,'+').replace(/_/g,'/');
  while(str.length%4) str+='=';
  var bin=atob(str); var arr=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return arr;
}
async function encodeState(state){
  var json = JSON.stringify(state);
  var enc = new TextEncoder().encode(json);
  var cs = new CompressionStream('deflate-raw');
  var writer = cs.writable.getWriter();
  writer.write(enc); writer.close();
  var buf = await new Response(cs.readable).arrayBuffer();
  return b64urlEncode(new Uint8Array(buf));
}
async function decodeState(str){
  var bytes = b64urlDecode(str);
  var ds = new DecompressionStream('deflate-raw');
  var writer = ds.writable.getWriter();
  writer.write(bytes); writer.close();
  var buf = await new Response(ds.readable).arrayBuffer();
  var json = new TextDecoder().decode(buf);
  return JSON.parse(json);
}

function defaultState(){
  return {v: DATA.meta.version, ts: Date.now(), sel: {}};
}
function loadState(){
  var raw;
  try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){ raw=null; }
  if(!raw) return defaultState();
  var st;
  try{ st = JSON.parse(raw); }catch(e){ return defaultState(); }
  if(!st.sel) st.sel = {};
  return st;
}
function saveState(){
  state.v = DATA.meta.version; state.ts = Date.now();
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}
function catSel(catId){
  if(!state.sel[catId]) state.sel[catId] = {fav:null, ok:[], no:[], c:{}, cc:''};
  return state.sel[catId];
}
function loadBestellt(){
  try{ return JSON.parse(localStorage.getItem(BESTELLT_KEY)||'{}'); }catch(e){ return {}; }
}
function saveBestellt(b){
  try{ localStorage.setItem(BESTELLT_KEY, JSON.stringify(b)); }catch(e){}
}

var state = loadState();
var app = document.getElementById('app');
var compareSelection = [];
var currentFilters = {shop:'', priceMax:'', widthMax:'', heightMax:'', vorgabeOnly:false};
var currentSort = 'empfehlung';

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function fmtPrice(p){ if(p==null) return '–'; return p.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'; }

function itemsOf(catId){ return DATA.items.filter(function(i){ return i.catId===catId; }); }

function decisionOf(item){
  var s = state.sel[item.catId];
  if(!s) return null;
  if(s.fav===item.id) return 'fav';
  if(s.ok && s.ok.indexOf(item.id)>-1) return 'ok';
  if(s.no && s.no.indexOf(item.id)>-1) return 'no';
  return null;
}
function setDecision(item, kind){
  var s = catSel(item.catId);
  s.ok = (s.ok||[]).filter(function(id){return id!==item.id;});
  s.no = (s.no||[]).filter(function(id){return id!==item.id;});
  if(s.fav===item.id) s.fav=null;
  var current = decisionOf(item);
  if(current===kind){ saveState(); return; } // toggle off
  if(kind==='fav') s.fav=item.id;
  if(kind==='ok') s.ok.push(item.id);
  if(kind==='no') s.no.push(item.id);
  saveState();
}
function progressOf(catId){
  var items = itemsOf(catId);
  var decided = items.filter(function(i){ return decisionOf(i)!==null; }).length;
  return {decided: decided, total: items.length};
}

function imgFallback(shopName, url){
  return '<div class="imgfallback"><div>'+esc(shopName)+'</div><div>Bild nicht verfügbar</div></div>';
}

function primaryImg(item){
  var e = item.enrich||{};
  if(item.bild_url_manuell) return item.bild_url_manuell;
  if(e.bilder && e.bilder.length) return e.bilder[0];
  return null;
}

function hashParams(){
  var h = location.hash.replace(/^#/,'');
  var params = {};
  h.split('&').forEach(function(pair){
    if(!pair) return;
    var idx = pair.indexOf('=');
    var k = idx>-1? pair.slice(0,idx) : pair;
    var v = idx>-1? pair.slice(idx+1) : '';
    params[k] = decodeURIComponent(v);
  });
  return params;
}

// ---------- ROUTER ----------
async function route(){
  var params = hashParams();
  if(params.mode==='order' && params.s){
    try{
      var decoded = await decodeState(params.s);
      renderOrder(decoded);
      return;
    }catch(e){
      app.innerHTML = '<p>Der Link konnte nicht gelesen werden.</p>';
      return;
    }
  }
  if(params.mode==='edit'){
    renderOverview(true);
    return;
  }
  renderOverview(false);
}
window.addEventListener('hashchange', route);

// ---------- OVERVIEW ----------
function renderOverview(editMode){
  var rooms = {};
  DATA.kategorien.forEach(function(c){
    if(!rooms[c.raum]) rooms[c.raum]=[];
    rooms[c.raum].push(c);
  });
  var html = '<div class="topbar"><div class="title">Möbel-Shortlist'+(editMode?' · Researcher':'')+'</div></div>';
  html += '<h1>Übersicht</h1>';
  Object.keys(rooms).forEach(function(room){
    html += '<div class="room-group"><h2>'+esc(room)+'</h2><div class="tiles">';
    rooms[room].forEach(function(c){
      var p = progressOf(c.id);
      var pct = p.total? Math.round(100*p.decided/p.total):0;
      html += '<div class="tile" data-cat="'+c.id+'">'
        + '<div class="kat">'+esc(c.kategorie)+'</div>'
        + '<div class="progress">'+p.decided+'/'+p.total+' entschieden'
        + '<div class="progress-bar"><div style="width:'+pct+'%"></div></div></div></div>';
    });
    html += '</div></div>';
  });
  if(editMode){
    html += '<div class="compare-bar"><button class="btn" id="exportBtn" style="flex:1">Änderungen exportieren</button>'
      + '<button class="btn primary" id="sendBtn" style="flex:1">Auswahl senden</button></div>';
  } else {
    html += '<div class="compare-bar"><button class="btn primary" id="sendBtn" style="width:100%">Auswahl senden</button></div>';
  }
  app.innerHTML = html;
  app.querySelectorAll('.tile').forEach(function(t){
    t.addEventListener('click', function(){ renderCategory(t.dataset.cat, editMode); });
  });
  document.getElementById('sendBtn').addEventListener('click', sendSelection);
  if(editMode){ document.getElementById('exportBtn').addEventListener('click', exportChanges); }
}

function exportChanges(){
  var out = {kategorien:[], items:[]};
  DATA.kategorien.forEach(function(c){ out.kategorien.push({id:c.id, empfehlung:c.empfehlung||''}); });
  DATA.items.forEach(function(it){ out.items.push({id:it.id, notiz_researcher_glatt: it.notiz_researcher_glatt||''}); });
  var json = JSON.stringify(out, null, 2);
  navigator.clipboard.writeText(json).then(function(){
    toast('JSON-Snippet in Zwischenablage kopiert');
  }).catch(function(){
    prompt('JSON-Snippet zum Einfügen in /curate:', json);
  });
}

// ---------- CATEGORY VIEW ----------
function renderCategory(catId, editMode){
  var cat = catsById[catId];
  var items = itemsOf(catId);
  compareSelection = [];
  var html = '<div class="topbar"><button class="back" id="backBtn">←</button>'
    + '<div class="title">'+esc(cat.raum)+' · '+esc(cat.kategorie)+'</div></div>';
  if(cat.empfehlung){
    html += '<div class="recomm">★ Empfehlung: '+esc(cat.empfehlung)+'</div>';
  }
  if(editMode){
    html += '<div class="recomm">Empfehlung bearbeiten: <input type="text" class="editfield" id="empfEdit" value="'+esc(cat.empfehlung||'')+'"></div>';
  }
  // filters
  var shops = Array.from(new Set(items.map(function(i){return i.enrich&&i.enrich.shop || i.shop;})));
  html += '<div class="filters">';
  html += '<select id="fShop"><option value="">Alle Shops</option>' + shops.map(function(s){return '<option value="'+esc(s)+'">'+esc(s)+'</option>';}).join('') + '</select>';
  html += '<input type="number" id="fPriceMax" placeholder="Preis bis €">';
  html += '<input type="number" id="fWidthMax" placeholder="Breite bis cm">';
  html += '<input type="number" id="fHeightMax" placeholder="Höhe bis cm">';
  html += '<label class="chk"><input type="checkbox" id="fVorgabe"> nur Vorgabe erfüllt</label>';
  html += '</div>';
  html += '<div class="sortbar">Sortieren: <select id="sortSel">'
    + '<option value="empfehlung">Empfehlung</option>'
    + '<option value="preis">Preis</option>'
    + '<option value="breite">Breite</option>'
    + '</select></div>';
  html += '<div id="cardList"></div>';
  html += '<div class="cat-comment"><label class="hint">Kommentar zur Kategorie</label>'
    + '<textarea class="comment" id="catComment" placeholder="Kommentar...">'+esc(catSel(catId).cc||'')+'</textarea></div>';
  html += '<div class="compare-bar"><button class="btn" id="compareBtn">Vergleichen (<span id="cmpCount">0</span>)</button>'
    + (editMode? '<button class="btn" id="exportBtn2">Export</button>' : '')
    + '<button class="btn primary" id="sendBtn2" style="flex:1">Auswahl senden</button></div>';
  app.innerHTML = html;

  document.getElementById('backBtn').addEventListener('click', function(){ location.hash = editMode?'mode=edit':''; renderOverview(editMode); });
  document.getElementById('sendBtn2').addEventListener('click', sendSelection);
  document.getElementById('compareBtn').addEventListener('click', function(){ openCompare(catId); });
  if(editMode){ document.getElementById('exportBtn2').addEventListener('click', exportChanges); }
  document.getElementById('catComment').addEventListener('input', function(e){
    catSel(catId).cc = e.target.value; saveState();
  });
  ['fShop','fPriceMax','fWidthMax','fHeightMax','fVorgabe','sortSel'].forEach(function(id){
    document.getElementById(id).addEventListener('input', function(){ drawCards(catId, editMode); });
    document.getElementById(id).addEventListener('change', function(){ drawCards(catId, editMode); });
  });
  if(editMode){
    document.getElementById('empfEdit').addEventListener('change', function(e){
      cat.empfehlung = e.target.value;
    });
  }
  drawCards(catId, editMode);
}

function passesFilter(item){
  var e = item.enrich||{};
  var shop = e.shop || item.shop;
  var f = currentFilters;
  if(f.shop && shop!==f.shop) return false;
  if(f.priceMax && e.preis!=null && e.preis>Number(f.priceMax)) return false;
  if(f.widthMax && e.masse_b!=null && e.masse_b>Number(f.widthMax)) return false;
  if(f.heightMax && e.masse_h!=null && e.masse_h>Number(f.heightMax)) return false;
  if(f.vorgabeOnly && item._vorgabeVerstoss) return false;
  return true;
}

function drawCards(catId, editMode){
  currentFilters.shop = document.getElementById('fShop').value;
  currentFilters.priceMax = document.getElementById('fPriceMax').value;
  currentFilters.widthMax = document.getElementById('fWidthMax').value;
  currentFilters.heightMax = document.getElementById('fHeightMax').value;
  currentFilters.vorgabeOnly = document.getElementById('fVorgabe').checked;
  currentSort = document.getElementById('sortSel').value;

  var items = itemsOf(catId).filter(passesFilter);
  items.sort(function(a,b){
    var ea=a.enrich||{}, eb=b.enrich||{};
    if(currentSort==='preis') return (ea.preis||1e9)-(eb.preis||1e9);
    if(currentSort==='breite') return (ea.masse_b||1e9)-(eb.masse_b||1e9);
    // empfehlung: prio asc (1=best), then recommended note
    var pa=a.prio||9, pb=b.prio||9;
    return pa-pb;
  });
  var html = '';
  items.forEach(function(item){
    var e = item.enrich||{};
    var img = primaryImg(item);
    var dec = decisionOf(item);
    var notiz = item.notiz_researcher_glatt || item.notiz_researcher;
    var isRec = item.prio===1;
    html += '<div class="card" data-item="'+item.id+'">';
    html += '<input type="checkbox" class="compare-check" data-cmp="'+item.id+'">';
    html += '<div class="imgwrap" data-open="'+item.id+'">';
    if(img){ html += '<img src="'+esc(img)+'" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display=\'none\';this.parentElement.innerHTML+=\''+imgFallback(e.shop||item.shop, item.url).replace(/'/g,"\\'")+'\'">'; }
    else { html += imgFallback(e.shop||item.shop, item.url); }
    html += '</div>';
    html += '<div class="body">';
    if(isRec) html += '<span class="badge rec">★ Researcher-Empfehlung</span>';
    html += '<h3>'+esc(e.titel||item.id)+'</h3>';
    html += '<div class="price">'+fmtPrice(e.preis)+(e.streichpreis?' <span style="text-decoration:line-through;color:var(--muted);font-weight:400;font-size:.85em">'+fmtPrice(e.streichpreis)+'</span>':'')+'</div>';
    html += '<div class="meta">'+(e.masse_b||'?')+' × '+(e.masse_t||'?')+' × '+(e.masse_h||'?')+' cm (B×T×H) · '+esc(e.shop||item.shop)+'</div>';
    if(notiz){ html += '<div class="notiz">'+(editMode? '<div contenteditable="true" class="editfield" data-notizedit="'+item.id+'">'+esc(notiz)+'</div>' : esc(notiz))+'</div>'; }
    html += '<div class="decision-row">'
      + '<button class="'+(dec==='fav'?'active fav':'')+'" data-dec="fav">★ Favorit</button>'
      + '<button class="'+(dec==='ok'?'active ok':'')+'" data-dec="ok">✓ Auch ok</button>'
      + '<button class="'+(dec==='no'?'active no':'')+'" data-dec="no">✗ Nein</button>'
      + '</div>';
    html += '<textarea class="comment" placeholder="Kommentar..." data-comment="'+item.id+'">'+esc(catSel(catId).c[item.id]||'')+'</textarea>';
    html += '</div></div>';
  });
  if(!items.length) html = '<p class="hint">Keine Treffer für diese Filter.</p>';
  var list = document.getElementById('cardList');
  list.innerHTML = html;

  list.querySelectorAll('[data-open]').forEach(function(el){
    el.addEventListener('click', function(){ openDetail(el.dataset.open); });
  });
  list.querySelectorAll('[data-dec]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var id = btn.closest('.card').dataset.item;
      setDecision(itemsById[id], btn.dataset.dec);
      drawCards(catId, editMode);
    });
  });
  list.querySelectorAll('[data-comment]').forEach(function(ta){
    ta.addEventListener('input', function(){
      catSel(catId).c[ta.dataset.comment] = ta.value; saveState();
    });
  });
  list.querySelectorAll('[data-cmp]').forEach(function(cb){
    cb.checked = compareSelection.indexOf(cb.dataset.cmp)>-1;
    cb.addEventListener('change', function(){
      var id = cb.dataset.cmp;
      if(cb.checked){
        if(compareSelection.length>=4){ cb.checked=false; return; }
        compareSelection.push(id);
      } else {
        compareSelection = compareSelection.filter(function(x){return x!==id;});
      }
      document.getElementById('cmpCount').textContent = compareSelection.length;
    });
  });
  if(editMode){
    list.querySelectorAll('[data-notizedit]').forEach(function(el){
      el.addEventListener('blur', function(){
        itemsById[el.dataset.notizedit].notiz_researcher_glatt = el.textContent.trim();
      });
    });
  }
  document.getElementById('cmpCount').textContent = compareSelection.length;
}

// ---------- DETAIL MODAL ----------
function openDetail(itemId){
  var item = itemsById[itemId]; var e = item.enrich||{};
  var imgs = (e.bilder||[]).slice(0,4);
  if(item.bild_url_manuell) imgs = [item.bild_url_manuell].concat(imgs);
  var html = '<div class="modal-overlay" id="overlay"><div class="modal">';
  html += '<div class="topbar" style="margin:-14px -14px 8px;padding-left:8px;"><button class="back" id="closeModal">←</button><div class="title">'+esc(e.titel||item.id)+'</div></div>';
  if(imgs.length){
    html += '<div class="gallery">'+imgs.map(function(u){return '<img src="'+esc(u)+'" loading="lazy" referrerpolicy="no-referrer">';}).join('')+'</div>';
  }
  html += '<table class="field-table">';
  var rows = [
    ['Preis', fmtPrice(e.preis) + (e.streichpreis? ' (statt '+fmtPrice(e.streichpreis)+')':'')],
    ['Maße B×T×H', (e.masse_b||'?')+' × '+(e.masse_t||'?')+' × '+(e.masse_h||'?')+' cm'],
    ['Material', e.material||'[LÜCKE]'],
    ['Farbe', e.farbe||'[LÜCKE]'],
    ['Shop', e.shop||item.shop],
    ['Artikelnr.', e.artikelnr||item.artikelnr||'[LÜCKE]'],
    ['Lieferzeit', e.lieferzeit||'[LÜCKE]'],
    ['Verfügbarkeit', e.verfuegbarkeit||'[LÜCKE]'],
    ['Abrufdatum', e.abrufdatum||'–']
  ];
  rows.forEach(function(r){ html += '<tr><td>'+r[0]+'</td><td>'+esc(r[1])+'</td></tr>'; });
  html += '</table>';
  if(e.beschreibung) html += '<p>'+esc(e.beschreibung)+'</p>';
  var c = item.curate||{};
  if((c.pros&&c.pros.length)||(c.cons&&c.cons.length)){
    html += '<div class="proscons">';
    if(c.pros&&c.pros.length) html += '<div class="pros"><b>Pro</b><ul>'+c.pros.map(function(p){return '<li>'+esc(p)+'</li>';}).join('')+'</ul></div>';
    if(c.cons&&c.cons.length) html += '<div class="cons"><b>Contra</b><ul>'+c.cons.map(function(p){return '<li>'+esc(p)+'</li>';}).join('')+'</ul></div>';
    html += '</div>';
  }
  html += '<a class="btn primary" style="display:block;text-align:center;text-decoration:none;" target="_blank" rel="noopener" href="'+esc(item.url)+'">Im Shop ansehen</a>';
  html += '</div></div>';
  var wrap = document.createElement('div'); wrap.innerHTML = html;
  document.body.appendChild(wrap.firstChild);
  document.getElementById('closeModal').addEventListener('click', closeModal);
  document.getElementById('overlay').addEventListener('click', function(ev){ if(ev.target.id==='overlay') closeModal(); });
}
function closeModal(){ var o = document.getElementById('overlay'); if(o) o.remove(); }

// ---------- COMPARE ----------
function openCompare(catId){
  if(compareSelection.length<2){ toast('Bitte 2–4 Items auswählen'); return; }
  var cat = catsById[catId];
  var dims = cat.vergleichsdimensionen;
  var items = compareSelection.map(function(id){return itemsById[id];});
  var html = '<div class="modal-overlay" id="overlay"><div class="modal">';
  html += '<div class="topbar" style="margin:-14px -14px 8px;padding-left:8px;"><button class="back" id="closeModal">←</button><div class="title">Vergleich</div></div>';
  html += '<table class="compare"><tr><th></th>' + items.map(function(it){
    var img = primaryImg(it);
    return '<th>'+(img?'<img src="'+esc(img)+'" referrerpolicy="no-referrer">':'')+'<div>'+esc((it.enrich&&it.enrich.titel)||it.id)+'</div></th>';
  }).join('') + '</tr>';
  var fieldMap = {
    'Breite': function(it){return (it.enrich||{}).masse_b;},
    'Höhe': function(it){return (it.enrich||{}).masse_h;},
    'Tiefe': function(it){return (it.enrich||{}).masse_t;},
    'Material': function(it){return (it.enrich||{}).material;},
    'Preis': function(it){return (it.enrich||{}).preis;}
  };
  dims.forEach(function(dim){
    var fn = fieldMap[dim]; if(!fn) return;
    var vals = items.map(fn);
    var numeric = vals.every(function(v){return typeof v==='number';});
    var best = numeric? Math.min.apply(null, vals.filter(function(v){return v!=null;})) : null;
    html += '<tr><td><b>'+dim+'</b></td>' + items.map(function(it,idx){
      var v = vals[idx];
      var isBest = numeric && v===best;
      var display = v==null? '[LÜCKE]' : (dim==='Preis'? fmtPrice(v) : (typeof v==='number'? v+' cm' : esc(v)));
      return '<td class="'+(isBest?'best':'')+'">'+display+'</td>';
    }).join('') + '</tr>';
  });
  html += '</table>';
  html += '<p class="hint">Bestwert (niedrigster Wert) je Zeile hervorgehoben, sofern numerisch vergleichbar. [ANNAHME: niedriger = besser]</p>';
  html += '</div></div>';
  var wrap = document.createElement('div'); wrap.innerHTML = html;
  document.body.appendChild(wrap.firstChild);
  document.getElementById('closeModal').addEventListener('click', closeModal);
  document.getElementById('overlay').addEventListener('click', function(ev){ if(ev.target.id==='overlay') closeModal(); });
}

function toast(msg){
  var t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2500);
}

// ---------- SEND SELECTION ----------
async function sendSelection(){
  var openCats = DATA.kategorien.filter(function(c){
    var s = state.sel[c.id];
    return !s || !s.fav;
  });
  var s = await encodeState(state);
  var url = location.origin + location.pathname + '#mode=order&s=' + s;
  if(openCats.length){
    toast('Hinweis: '+openCats.length+' Kategorie(n) ohne Favorit. Sende trotzdem...');
  }
  if(navigator.share){
    try{
      await navigator.share({title:'Möbel-Auswahl', url: url});
      return;
    }catch(e){ /* fall through to copy */ }
  }
  try{
    await navigator.clipboard.writeText(url);
    toast('Link kopiert!');
  }catch(e){
    prompt('Link kopieren:', url);
  }
}

// ---------- ORDER MODE (Umsetzer) ----------
function renderOrder(decodedState){
  var bestellt = loadBestellt();
  var shopGroups = {};
  var openCats = [];
  DATA.kategorien.forEach(function(cat){
    var sel = decodedState.sel[cat.id];
    if(!sel || !sel.fav){
      var okItems = (sel&&sel.ok||[]).map(function(id){return itemsById[id];}).filter(Boolean);
      openCats.push({cat:cat, ok:okItems});
      return;
    }
    var item = itemsById[sel.fav];
    if(!item) return;
    var e = item.enrich||{};
    var shop = e.shop || item.shop;
    if(!shopGroups[shop]) shopGroups[shop]=[];
    shopGroups[shop].push({item:item, comment: sel.c && sel.c[sel.fav] || ''});
  });

  var html = '<div class="topbar"><div class="title">Bestellliste</div></div>';
  html += '<h1>Favoriten nach Shop</h1>';
  var grandTotal = 0;
  Object.keys(shopGroups).forEach(function(shop){
    var rows = shopGroups[shop];
    var sum = rows.reduce(function(s,r){ return s + ((r.item.enrich&&r.item.enrich.preis)||0); },0);
    grandTotal += sum;
    html += '<div class="shop-group"><h3>'+esc(shop)+' <button class="btn" data-openshop="'+esc(shop)+'">Alle Links öffnen</button></h3>';
    rows.forEach(function(r){
      var e = r.item.enrich||{};
      var img = primaryImg(r.item);
      var stale = e.abrufdatum && (Date.now() - new Date(e.abrufdatum).getTime()) > 14*24*3600*1000;
      html += '<div class="order-row"><input type="checkbox" data-bestellt="'+r.item.id+'" '+(bestellt[r.item.id]?'checked':'')+'>';
      if(img) html += '<img src="'+esc(img)+'" loading="lazy" referrerpolicy="no-referrer">';
      html += '<div class="info"><div>'+esc(e.titel||r.item.id)+'</div>';
      html += '<div class="artnr">'+esc(e.artikelnr||r.item.artikelnr||'–')+' <button data-copy="'+esc(e.artikelnr||r.item.artikelnr||'')+'">Kopieren</button></div>';
      html += '<div class="price">'+fmtPrice(e.preis)+(stale?' <span style="color:var(--no)">[VERALTET]</span>':'')+'</div>';
      if(r.comment) html += '<div class="comment">„'+esc(r.comment)+'"</div>';
      html += '<a href="'+esc(r.item.url)+'" target="_blank" rel="noopener">Zum Shop</a>';
      html += '</div></div>';
    });
    html += '<div class="sumline"><span>Summe '+esc(shop)+'</span><span>'+fmtPrice(sum)+'</span></div>';
    html += '</div>';
  });
  html += '<div class="totalline">Gesamtsumme: '+fmtPrice(grandTotal)+'</div>';
  html += '<button class="btn" id="csvBtn" style="width:100%;margin-top:14px;">CSV-Export</button>';

  if(openCats.length){
    html += '<h2>Offen</h2>';
    openCats.forEach(function(o){
      html += '<div class="open-cat"><b>'+esc(o.cat.raum)+' · '+esc(o.cat.kategorie)+'</b>: kein Favorit gewählt.';
      if(o.ok.length){
        html += '<div class="hint">Auch ok: '+o.ok.map(function(it){return esc((it.enrich&&it.enrich.titel)||it.id);}).join(', ')+'</div>';
      }
      html += '</div>';
    });
  }
  app.innerHTML = html;

  app.querySelectorAll('[data-bestellt]').forEach(function(cb){
    cb.addEventListener('change', function(){
      bestellt[cb.dataset.bestellt] = cb.checked; saveBestellt(bestellt);
    });
  });
  app.querySelectorAll('[data-copy]').forEach(function(btn){
    btn.addEventListener('click', function(){
      navigator.clipboard.writeText(btn.dataset.copy).then(function(){ toast('Artikelnr. kopiert'); }).catch(function(){});
    });
  });
  app.querySelectorAll('[data-openshop]').forEach(function(btn){
    btn.addEventListener('click', function(){
      toast('Popup-Blocker ggf. bestätigen');
      (shopGroups[btn.dataset.openshop]||[]).forEach(function(r){ window.open(r.item.url, '_blank'); });
    });
  });
  document.getElementById('csvBtn').addEventListener('click', function(){ exportCsv(shopGroups); });
}

function exportCsv(shopGroups){
  var lines = ['Shop;Kategorie;Produkt;Artikelnr;Preis;Link'];
  Object.keys(shopGroups).forEach(function(shop){
    shopGroups[shop].forEach(function(r){
      var e = r.item.enrich||{};
      var cat = catsById[r.item.catId];
      var row = [shop, cat.kategorie, (e.titel||r.item.id).replace(/;/g,','), e.artikelnr||r.item.artikelnr||'', e.preis||'', r.item.url];
      lines.push(row.join(';'));
    });
  });
  var blob = new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'bestellliste.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

// ---------- EXPORT CHANGES (Researcher) ----------

route();
})();
