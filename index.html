<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>CozyNest – Unsere Auswahl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#F8F4EC;--surface:#FFFDF8;--sand:#EFE7DA;--beige:#E3D8C6;--border:#E8E0D2;
  --text:#3A3835;--muted:#8A857D;--sage:#8FA088;--sage-soft:#E3EADF;
  --rose:#B98589;--rose-soft:#F2E1DE;--note-bg:#F3EDE2;--img-bg:#FFFFFF;
  --shadow:0 2px 14px rgba(40,38,35,.06);--r:16px;
  --serif:"Fraunces",Georgia,serif;--sans:"Nunito Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1E1D1B;--surface:#292826;--sand:#34322F;--beige:#403D39;--border:#3D3B37;
  --text:#F1ECE4;--muted:#A8A298;--sage:#A7B7A0;--sage-soft:#2F3A2D;
  --rose:#D7A9AC;--rose-soft:#3E2F30;--note-bg:#2F2D2A;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 var(--sans);padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;line-height:1.2}
a{color:var(--text)}
button,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.top{padding:28px 0 8px}
.top h1{font-size:2rem}
.sub{color:var(--muted);margin:2px 0 16px}
.progress{height:4px;background:var(--sand);border-radius:4px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--sage);transition:width .3s}
.plabel{font-size:.875rem;color:var(--muted);margin-top:8px}
.room{margin:32px 0}
.room>h2{font-size:1.5rem;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr;gap:20px}
@media (min-width:720px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}
.panel,.card,.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.tile{padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;width:100%}
.tile:hover{border-color:var(--beige)}
.tile h3{font-size:1.25rem}
.tmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:.9rem}
.tcount{color:var(--muted)}
.state{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--sand);font-size:.85rem;font-weight:600}
.state.done{background:var(--rose-soft)}
.state.ordered{background:var(--sage-soft)}
.mini{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--muted)}
.mini .imgbox{width:56px;flex:0 0 56px;padding:3px;border-radius:8px}
.mini span{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.imgbox{aspect-ratio:4/3;background:var(--img-bg);padding:8px;border-radius:12px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.imgbox img{width:100%;height:100%;object-fit:contain;display:block}
.imgbox.fb{background:var(--note-bg)}
.imgfb{display:flex;align-items:center;justify-content:center;width:100%;height:100%;color:var(--muted);font-size:.8rem;text-decoration:none}
.badge{position:absolute;top:10px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--sage-soft);color:var(--text);border:1px solid var(--sage)}
.badge.r{right:10px}.badge.l{left:10px}
.back{background:none;border:0;padding:10px 0;min-height:44px;cursor:pointer;color:var(--muted);font-weight:600}
.back:hover{color:var(--text)}
.chead{margin:4px 0 20px}
.chead h2{font-size:1.75rem}
.chead .room-name{color:var(--muted);font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{padding:6px 12px;border-radius:999px;background:var(--rose-soft);border:1px solid var(--rose);font-size:.85rem}
.emp{margin-top:12px;padding:10px 14px;border-radius:12px;background:var(--sage-soft);font-size:.95rem}
.card{padding:12px;display:flex;flex-direction:column;gap:10px;transition:opacity .2s}
.card.dim{opacity:.55}
.card h3{font-family:var(--sans);font-weight:700;font-size:1.05rem;line-height:1.35}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.desc{color:var(--muted);font-size:.92rem;margin:0}
.price{font-family:var(--serif);font-size:1.6rem;line-height:1.1}
.price.unknown{font-family:var(--sans);font-size:1rem;color:var(--muted)}
.dims{font-size:.92rem}
.warn{color:var(--rose);font-size:.88rem}
.note{background:var(--note-bg);border-left:4px solid var(--sage);border-radius:0 12px 12px 0;padding:10px 12px}
.note b{display:block;font-size:.88rem}
.note p{margin:4px 0 0;white-space:pre-line;overflow-wrap:anywhere}
.note textarea{margin-top:6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.btn,.seg button{background:var(--sand);border:1px solid var(--border);border-radius:12px;min-height:44px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:.92rem}
.btn:hover,.seg button:hover{background:var(--beige)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn[disabled]:hover{background:var(--sand)}
.seg .ic{color:var(--muted);margin-right:4px}
.seg button.on-fav{background:var(--rose-soft);border-color:var(--rose)}
.seg button.on-fav .ic{color:var(--rose)}
.seg button.on-ok{background:var(--sage-soft);border-color:var(--sage)}
.seg button.on-ok .ic{color:var(--sage)}
.seg button.on-no{background:var(--sand);border-color:var(--muted)}
.plink{font-size:.92rem;font-weight:600;padding:6px 0;display:inline-block}
.cwrap{position:relative}
textarea.cm{width:100%;min-height:44px;resize:none;overflow:hidden;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:10px 12px;line-height:1.45}
textarea.cm:focus{border-color:var(--beige)}
textarea.cm::placeholder{color:var(--muted)}
.saved{position:absolute;right:10px;bottom:-18px;font-size:.75rem;color:var(--sage);opacity:0;transition:opacity .2s}
.saved.show{opacity:1}
details{border-top:1px solid var(--border);padding-top:6px}
summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600;color:var(--muted)}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.thumbs .imgbox{padding:4px;border-radius:8px}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 10px;font-size:.9rem}
dt{color:var(--muted)}dd{margin:0}
.pc h4{margin:6px 0 2px;font-size:.85rem;color:var(--muted)}
.pc ul{margin:0;padding-left:18px;font-size:.9rem}
.ccat{margin:28px 0}
.ccat h3{font-size:1.2rem;margin-bottom:8px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);box-shadow:var(--shadow);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.bar .wrap{display:flex;align-items:center;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.bar .info{margin-right:auto;font-size:.88rem;color:var(--muted)}
.primary{background:var(--text);color:var(--surface);border:1px solid var(--text);border-radius:12px;min-height:44px;padding:10px 20px;font-weight:700;cursor:pointer}
.primary[disabled]{opacity:.5;cursor:not-allowed}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 40px);z-index:6}
.toast.show{opacity:1}
.panel{padding:16px;margin:20px 0}
.panel>h2{font-size:1.35rem}
.shophead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sum{font-weight:700}
.row{display:grid;grid-template-columns:88px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
.row .imgbox{padding:4px;border-radius:10px}
.row h3{font-family:var(--sans);font-weight:700;font-size:1rem}
.rmeta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:.9rem;margin-top:4px}
.copy{background:var(--sand);border:1px solid var(--border);border-radius:8px;min-height:32px;min-width:44px;padding:2px 10px;cursor:pointer;font-size:.85rem}
.pcomment{margin-top:6px;font-size:.9rem;padding:6px 10px;background:var(--rose-soft);border-radius:10px}
.check{display:inline-flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;font-weight:600;font-size:.9rem}
.check input{width:22px;height:22px;accent-color:var(--sage)}
.check.locked{color:var(--muted);cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.hint{font-size:.82rem;color:var(--muted)}
.total{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:1.05rem}
.muted{color:var(--muted)}
.foot{margin:40px 0 10px;font-size:.78rem;color:var(--muted);text-align:center}
.open-item{padding:4px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  if(v.H!=null)p.push('max. '+v.H+' cm hoch');if(v.EUR!=null)p.push('Budget max. '+fmtPrice(v.EUR));return p.join(', ');}
function renderCat(cid){
  var c=CAT[cid];if(!c){view.cat=null;return renderHome();}
  $app.appendChild(header('Unsere Auswahl für die neue Wohnung'));
  var back=el('button','back','← Alle Kategorien');attr(back,{type:'button'});
  back.addEventListener('click',function(){if(history.state&&history.state.cat)history.back();else{view.cat=null;render();}});
  $app.appendChild(back);
  var hd=el('div','chead');hd.appendChild(el('div','room-name',c.raum));hd.appendChild(el('h2',null,c.kategorie));
  var v=parseVorgabe(c.vorgabe);
  if(c.vorgabe){var chips=el('div','chips');chips.appendChild(el('span','chip',vorgabeText(v)||String(c.vorgabe)));hd.appendChild(chips);}
  var emp=empOf(c);
  if(MODE==='edit'){var ew=el('div','emp');ew.appendChild(el('b',null,'Empfehlung (1 Satz)'));
    ew.appendChild(commentField('Empfehlung für diese Kategorie …',emp,function(t){edits.emp[c.id]=t;saveJSON(EKEY,edits);}));hd.appendChild(ew);}
  else if(emp){hd.appendChild(el('div','emp','Empfehlung: '+emp));}
  $app.appendChild(hd);
  var sel=getSel(cid),rec=recItem(c),list=sortedItems(c);
  var yes=list.filter(function(it){return statusOf(sel,it.id)!=='no';}),no=list.filter(function(it){return statusOf(sel,it.id)==='no';});
  var g=el('div','grid');yes.concat(no).forEach(function(it){g.appendChild(card(it,c,sel,v,rec&&rec.id===it.id));});$app.appendChild(g);
  var cc=el('section','ccat');cc.appendChild(el('h3',null,'Kommentar zu „'+c.kategorie+'“'));
  cc.appendChild(commentField('Dein Kommentar zur Kategorie …',sel.cc,function(t){var s=getSel(cid);s.cc=t;setSel(cid,s);}));$app.appendChild(cc);}
function card(it,c,sel,v,isRec){
  var st=statusOf(sel,it.id),a=el('article','card'+(st==='no'?' dim':''));
  var box=imgBox(it,true);
  if(isRec)box.appendChild(el('span','badge l','Empfehlung'));
  if(isOrdered(it))box.appendChild(el('span','badge r','📦 Bestellt'));
  a.appendChild(box);
  a.appendChild(el('h3','clamp',titleOf(it)));
  var d=(it.enrich&&it.enrich.beschreibung)||'';if(d)a.appendChild(el('p','desc clamp',d));
  var p=priceOf(it);a.appendChild(p==null?el('div','price unknown','Preis im Shop'):el('div','price',fmtPrice(p)));
  var dm=dimsOf(it),parts=[];if(dm.b!=null)parts.push('B '+dm.b);if(dm.t!=null)parts.push('T '+dm.t);if(dm.h!=null)parts.push('H '+dm.h);
  if(parts.length)a.appendChild(el('div','dims',parts.join(' × ')+' cm'));
  var vio=violations(it,v);if(vio.length)a.appendChild(el('div','warn',vio.join(', ')));
  var note=noteOf(it);
  if(note||MODE==='edit'){var nb=el('div','note');nb.appendChild(el('b',null,'💬 '+NOTE_LABEL));
    if(MODE==='edit')nb.appendChild(commentField('Notiz …',note,function(t){edits.notes[it.id]=t;saveJSON(EKEY,edits);}));
    else nb.appendChild(el('p',null,note));a.appendChild(nb);}
  var seg=el('div','seg');attr(seg,{role:'group','aria-label':'Bewertung'});
  [['fav','♥','Favorit'],['ok','✓','Auch ok'],['no','✕','Nein']].forEach(function(o){
    var b=el('button',st===o[0]?'on-'+o[0]:null);attr(b,{type:'button','aria-pressed':String(st===o[0])});
    b.appendChild(el('span','ic',o[1]));b.appendChild(document.createTextNode(o[2]));
    b.addEventListener('click',function(){var y=window.scrollY;setSel(c.id,applyStatus(getSel(c.id),it.id,o[0]));render();window.scrollTo(0,y);});
    seg.appendChild(b);});
  a.appendChild(seg);
  var pl=el('div');pl.appendChild(extLink(it.url,'Zum Produkt ↗','plink'));a.appendChild(pl);
  a.appendChild(commentField('Dein Kommentar …',sel.c[it.id]||'',function(t){var s=getSel(c.id);if(t)s.c[it.id]=t;else delete s.c[it.id];setSel(c.id,s);}));
  a.appendChild(detailsBlock(it));return a;}
function detailsBlock(it){
  var dt=el('details');if(openDetails[it.id])dt.open=true;dt.addEventListener('toggle',function(){openDetails[it.id]=dt.open;});
  dt.appendChild(el('summary',null,'Details'));
  var more=images(it).slice(1);
  if(more.length){var th=el('div','thumbs');more.forEach(function(u){var b=el('div','imgbox'),img=document.createElement('img');
    attr(img,{loading:'lazy',referrerpolicy:'no-referrer',decoding:'async',alt:''});img.addEventListener('error',function(){b.remove();});
    img.setAttribute('src',u);b.appendChild(img);th.appendChild(b);});dt.appendChild(th);}
  var e=it.enrich||{},dl=el('dl');[['Material',e.material],['Farbe',e.farbe],['Lieferzeit',e.lieferzeit],['Shop',e.shop]].forEach(function(r){
    if(r[1]){dl.appendChild(el('dt',null,r[0]));dl.appendChild(el('dd',null,r[1]));}});
  if(dl.childNodes.length)dt.appendChild(dl);
  var cu=it.curate||{},pc=el('div','pc');
  [['Pro',cu.pros],['Contra',cu.cons]].forEach(function(r){if(r[1]&&r[1].length){pc.appendChild(el('h4',null,r[0]));var ul=el('ul');
    r[1].forEach(function(x){ul.appendChild(el('li',null,clean(x)));});pc.appendChild(ul);}});
  if(pc.childNodes.length)dt.appendChild(pc);return dt;}

/* ---------- Senden / Export ---------- */
function send(){
  var payload={v:2,ts:state.ts||Date.now(),sel:state.sel},open=ACTIVE.length-decidedCount();
  var hint=open?' · '+open+(open===1?' Kategorie':' Kategorien')+' noch offen':'';
  if(typeof CompressionStream==='undefined'){toast('Dieser Browser kann keinen Link erzeugen. Bitte Browser aktualisieren.');return;}
  encodeState(payload).then(function(s){
    var url=location.href.split('#')[0]+'#mode=order&s='+s;
    if(navigator.share){return navigator.share({title:'CozyNest – unsere Auswahl',url:url}).then(function(){toast('Geteilt'+hint);},function(e){if(e&&e.name==='AbortError')return;return copyText(url).then(function(ok){toast(ok?'Link kopiert'+hint:'Kopieren nicht möglich');});});}
    return copyText(url).then(function(ok){toast(ok?'Link kopiert'+hint:'Kopieren nicht möglich');});
  }).catch(function(){toast('Link konnte nicht erzeugt werden.');});}
function exportEdits(){
  var notes={},emp={};
  Object.keys(edits.notes).forEach(function(id){if(ITEM[id]&&edits.notes[id]!==(ITEM[id].notiz_researcher||''))notes[id]=edits.notes[id];});
  Object.keys(edits.emp).forEach(function(id){if(CAT[id]&&edits.emp[id]!==(CAT[id].empfehlung||''))emp[id]=edits.emp[id];});
  if(!Object.keys(notes).length&&!Object.keys(emp).length){toast('Keine Änderungen vorhanden');return;}
  copyText(JSON.stringify({typ:'shortlist-edits',version:META.version,notiz_researcher:notes,empfehlung:emp},null,1)).then(function(ok){
    toast(ok?'Kopiert – im Projekt-Chat mit /curate einfügen':'Kopieren nicht möglich');});}
function barDecide(){
  var open=ACTIVE.length-decidedCount();
  $bar.appendChild(el('span','info',open?open+(open===1?' Kategorie':' Kategorien')+' offen':'Alles entschieden'));
  if(MODE==='edit'){var x=el('button','btn','Änderungen exportieren');attr(x,{type:'button'});x.addEventListener('click',exportEdits);$bar.appendChild(x);}
  var b=el('button','primary','Auswahl senden');attr(b,{type:'button'});b.addEventListener('click',send);$bar.appendChild(b);}

/* ---------- Modus 2: Umsetzer ---------- */
function localOrdered(){var o=loadJSON(OKEY,null)||{};Object.keys(o).forEach(function(k){if(!ITEM[k])delete o[k];});return o;}
function favRows(st){var rows=[];ACTIVE.forEach(function(c){var s=normSel(st.sel[c.id]);if(s.fav&&ITEM[s.fav])rows.push({it:ITEM[s.fav],cat:c,comment:s.c[s.fav]||'',cc:s.cc});});return rows;}
function orderStatus(it,lo){if(isOrdered(it))return {st:'bestellt',date:it.bestellt_am||''};if(lo[it.id])return {st:'bestellt',date:typeof lo[it.id]==='string'?lo[it.id]:''};return {st:'offen',date:''};}
function newlyChecked(rows,lo){return rows.filter(function(r){return !isOrdered(r.it)&&lo[r.it.id];}).map(function(r){return r.it.id;});}
function sumLine(rows,lo){var t=0,o=0,miss=0;rows.forEach(function(r){var p=priceOf(r.it);if(p==null){miss++;return;}t+=p;if(orderStatus(r.it,lo).st==='bestellt')o+=p;});
  return fmtPrice(t)+(miss?' + '+miss+' ohne Preis':'')+' · davon bestellt '+fmtPrice(o);}
function renderOrder(){
  var st=orderState||state,lo=localOrdered(),rows=favRows(st);
  $app.appendChild(header('Bestellübersicht'));
  if(!rows.length){var e=el('div','panel');e.appendChild(el('p',null,'Noch keine Favoriten in diesem Link. Bitte den Link aus „Auswahl senden“ vollständig öffnen.'));$app.appendChild(e);}
  var shops=[];rows.forEach(function(r){var k=r.it.shop||shopName(r.it);var g=shops.filter(function(x){return x.k===k;})[0];if(!g){g={k:k,name:shopName(r.it),rows:[]};shops.push(g);}g.rows.push(r);});
  shops.forEach(function(g){
    var p=el('section','panel'),h=el('div','shophead');h.appendChild(el('h2',null,g.name));h.appendChild(el('span','sum',sumLine(g.rows,lo)));p.appendChild(h);
    g.rows.forEach(function(r){p.appendChild(orderRow(r,lo));});
    var ac=el('div','actions'),ob=el('button','btn','Alle Links dieses Shops öffnen');attr(ob,{type:'button'});
    ob.addEventListener('click',function(){var lo2=localOrdered(),n=0;g.rows.forEach(function(r){if(orderStatus(r.it,lo2).st!=='bestellt'){window.open(r.it.url,'_blank','noopener');n++;}});
      toast(n?n+' Link'+(n===1?'':'s')+' geöffnet':'Alles bereits bestellt');});
    ac.appendChild(ob);ac.appendChild(el('span','hint','Bei nur einem Tab: Pop-ups für diese Seite einmalig erlauben. Bestelltes wird übersprungen.'));
    p.appendChild(ac);$app.appendChild(p);});
  if(rows.length){var tp=el('section','panel'),tl=el('div','total');tl.appendChild(el('b',null,'Gesamt'));tl.appendChild(el('span','sum',sumLine(rows,lo)));tp.appendChild(tl);$app.appendChild(tp);}
  var openCats=ACTIVE.filter(function(c){return !normSel(st.sel[c.id]).fav;});
  if(openCats.length){var op=el('section','panel');op.appendChild(el('h2',null,'Offen'));
    openCats.forEach(function(c){var s=normSel(st.sel[c.id]),w=el('div','row');w.style.gridTemplateColumns='1fr';var inner=el('div');
      inner.appendChild(el('h3',null,c.raum+' · '+c.kategorie));
      var oks=s.ok.filter(function(id){return ITEM[id];});
      if(oks.length){oks.forEach(function(id){var d=el('div','open-item');d.appendChild(document.createTextNode('✓ Auch ok: '));d.appendChild(extLink(ITEM[id].url,titleOf(ITEM[id])));
        var pr=priceOf(ITEM[id]);if(pr!=null)d.appendChild(document.createTextNode(' · '+fmtPrice(pr)));inner.appendChild(d);});}
      else inner.appendChild(el('div','muted','Keine Alternativen markiert'));
      if(s.cc)inner.appendChild(el('div','pcomment','Kommentar: '+s.cc));w.appendChild(inner);op.appendChild(w);});
    $app.appendChild(op);}}
function orderRow(r,lo){
  var it=r.it,w=el('div','row');w.appendChild(imgBox(it,true));var info=el('div');
  info.appendChild(el('h3','clamp',titleOf(it)));info.appendChild(el('div','muted',r.cat.raum+' · '+r.cat.kategorie));
  var m=el('div','rmeta'),nr=artnr(it);
  if(nr){var s=el('span',null,'Art.-Nr. '+nr);m.appendChild(s);var cb=el('button','copy','Kopieren');attr(cb,{type:'button','aria-label':'Artikelnummer kopieren'});
    cb.addEventListener('click',function(){copyText(nr).then(function(ok){toast(ok?'Artikelnummer kopiert':'Kopieren nicht möglich');});});m.appendChild(cb);}
  var p=priceOf(it);m.appendChild(el('b',null,p==null?'Preis im Shop':fmtPrice(p)));m.appendChild(extLink(it.url,'Zum Produkt ↗','plink'));info.appendChild(m);
  if(r.comment)info.appendChild(el('div','pcomment','Kommentar: '+r.comment));
  if(r.cc)info.appendChild(el('div','pcomment','Zur Kategorie: '+r.cc));
  var lab=el('label','check'),ch=document.createElement('input');attr(ch,{type:'checkbox'});
  if(isOrdered(it)){ch.checked=true;ch.disabled=true;lab.classList.add('locked');lab.appendChild(ch);lab.appendChild(document.createTextNode('bestellt'+(it.bestellt_am?' am '+ddmm(it.bestellt_am):'')));}
  else{ch.checked=!!lo[it.id];ch.addEventListener('change',function(){var o=localOrdered();if(ch.checked)o[it.id]=today();else delete o[it.id];saveJSON(OKEY,o);var y=window.scrollY;render();window.scrollTo(0,y);});
    lab.appendChild(ch);lab.appendChild(document.createTextNode('bestellt'));}
  info.appendChild(lab);w.appendChild(info);return w;}
function csvCell(v){v=String(v==null?'':v).replace(/[\r\n]+/g,' ').replace(/;/g,',');return /"/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function exportCSV(){
  var st=orderState||state,lo=localOrdered(),rows=favRows(st);
  var lines=['ID;Raum;Kategorie;Produkt;Shop;Artikelnr;Preis;Link;Kommentar_Partnerin;Status;Bestellt_am'];
  rows.forEach(function(r){var it=r.it,p=priceOf(it),os=orderStatus(it,lo);
    lines.push([it.id,r.cat.raum,r.cat.kategorie,titleOf(it),shopName(it),artnr(it),p==null?'':p.toFixed(2).replace('.',','),it.url,r.comment,os.st,os.date].map(csvCell).join(';'));});
  var blob=new Blob(['\ufeff'+lines.join('\r\n')+'\r\n'],{type:'text/csv;charset=utf-8'}),a=el('a');
  attr(a,{href:URL.createObjectURL(blob),download:'bestellliste.csv'});document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);toast('bestellliste.csv erstellt');}
function barOrder(){
  var lo=localOrdered(),ids=newlyChecked(favRows(orderState||state),lo);
  $bar.appendChild(el('span','info',ids.length?ids.length+' neu angehakt':'Keine neuen Haken'));
  var c=el('button','btn','CSV exportieren');attr(c,{type:'button'});c.addEventListener('click',exportCSV);$bar.appendChild(c);
  var b=el('button','primary','Bestellstatus übernehmen');attr(b,{type:'button'});if(!ids.length)b.disabled=true;
  b.addEventListener('click',function(){var ids2=newlyChecked(favRows(orderState||state),localOrdered());if(!ids2.length)return;
    copyText('/bestellt '+ids2.join(' ')).then(function(ok){toast(ok?'Kopiert – im Projekt-Chat einfügen':'Kopieren nicht möglich');});});
  $bar.appendChild(b);}

/* ---------- Render / Init ---------- */
function render(){
  $app.replaceChildren();$bar.replaceChildren();
  if(MODE==='order'){renderOrder();barOrder();}
  else{if(view.cat)renderCat(view.cat);else renderHome();barDecide();}
  $app.appendChild(el('p','foot','Stand '+(META.version||'')));}
function init(){
  var s=H.get('s');
  if(!s){render();return;}
  if(typeof DecompressionStream==='undefined'){toast('Dieser Browser kann den Link nicht lesen. Bitte Browser aktualisieren.');render();return;}
  decodeState(s).then(function(inc){var c=cleanState(inc,ITEMCAT);
    if(MODE==='order')orderState=c;
    else{if(c.ts>=state.ts){state=c;saveJSON(KEY,state);}history.replaceState(null,'',location.href.split('#')[0]+(MODE==='edit'?'#mode=edit':''));}
  }).catch(function(){toast('Link unvollständig – bitte komplett kopieren und erneut öffnen.');}).then(render);}
init();
})();
</script>
